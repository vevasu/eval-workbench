}
function saveSuite() {
  const name = $('#f-name').value.trim(); if (!name) { const e = $('#f-err'); e.hidden = false; e.textContent = 'Give the suite a name.'; return; }
  const s = createSuite({ name, description: $('#f-desc').value.trim(), pipeline: $('#f-pipe').value, slaMs: +$('#f-sla').value || 3000, systemPrompt: $('#f-sys').value.trim(), context: $('#f-ctx').value.trim(), cases: [] });
  closeModal(); toast('Suite created'); go('#/suites/' + s.id);
}
function createSuite(o) {
  const idBase = o.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 30) || 'suite';
  let id = idBase, i = 2; while (getSuite(id)) id = idBase + '-' + i++;
  let prefix = (o.name.match(/\b[a-z]/gi) || ['S']).slice(0, 2).join('').toUpperCase(); if (prefix.length < 2) prefix += 'X';
  const s = { id, prefix, name: o.name, description: o.description || '', pipeline: o.pipeline || 'chat', slaMs: o.slaMs || 3000, baseMs: 1200, systemPrompt: o.systemPrompt || '', context: o.context || '', createdAt: Date.now(), cases: o.cases || [] };
  Store.state.suites.push(s); Store.save(); return s;
}
function caseFormHtml(tc) {
  const get = (t, f) => { const c = (tc && tc.checks || []).find(c => c.type === t); return c ? f(c) : ''; };
  return `<div class="form-grid">
    <label class="field full"><span>Input or prompt</span><textarea id="c-input">${esc(tc ? tc.input : '')}</textarea></label>
    <label class="field full"><span>Expected output or behaviour</span><textarea id="c-exp" style="min-height:54px">${esc(tc ? tc.expected : '')}</textarea></label>
    <label class="field"><span>Tag</span><input type="text" id="c-tag" value="${esc(tc && tc.tag || '')}" placeholder="For example: Refunds"></label>
    <label class="field"><span>Max length (characters)</span><input type="number" id="c-max" value="${esc(get('max_length', c => c.max))}"></label>
    <label class="field"><span>Must include all</span><textarea id="c-all" placeholder="One per line">${esc(get('contains_all', c => c.values.join('\n')))}</textarea></label>
    <label class="field"><span>Must include one of</span><textarea id="c-any" placeholder="One per line">${esc(get('contains_any', c => c.values.join('\n')))}</textarea></label>
    <label class="field"><span>Must not include</span><textarea id="c-not" placeholder="One per line">${esc(get('not_contains', c => c.values.join('\n')))}</textarea></label>
    <label class="field"><span>Output must match pattern (regex)</span><input type="text" id="c-re" value="${esc(get('regex', c => c.pattern))}"><small>Case-insensitive.</small></label>
    <label class="field"><span>JSON keys required</span><input type="text" id="c-json" value="${esc(get('json_keys', c => c.keys.join(', ')))}" placeholder="Comma-separated"></label>
    <label class="field"><span>Human review rubric</span><input type="text" id="c-human" value="${esc(get('human', c => c.rubric))}" placeholder="Leave empty if checks are enough"></label>
  </div><p class="note">Checks run in order. Any failed check fails the case; a partly met "include all" check or a rubric sends it to review.</p><p class="err" id="c-err" hidden></p>`;
}
function readCaseForm() {
  const lines = id => $(id).value.split('\n').map(s => s.trim()).filter(Boolean);
  const checks = [];
  if (lines('#c-not').length) checks.push({ type: 'not_contains', values: lines('#c-not') });
  if ($('#c-json').value.trim()) checks.push({ type: 'json_keys', keys: $('#c-json').value.split(',').map(s => s.trim()).filter(Boolean) });
  if ($('#c-re').value.trim()) checks.push({ type: 'regex', pattern: $('#c-re').value.trim(), flags: 'i' });
  if (lines('#c-any').length) checks.push({ type: 'contains_any', values: lines('#c-any') });
  if (lines('#c-all').length) checks.push({ type: 'contains_all', values: lines('#c-all') });
  if (+$('#c-max').value > 0) checks.push({ type: 'max_length', max: +$('#c-max').value });
  if ($('#c-human').value.trim()) checks.push({ type: 'human', rubric: $('#c-human').value.trim() });
  return { input: $('#c-input').value.trim(), expected: $('#c-exp').value.trim(), tag: $('#c-tag').value.trim(), checks };
}
function modalCase(suiteId, caseId) {
  const s = getSuite(suiteId); const tc = caseId ? s.cases.find(c => c.id === caseId) : null;
  openModal(`<h2>${tc ? 'Edit ' + esc(tc.id) : 'Add test case'}</h2><p class="hint">${esc(s.name)}. Checks decide the result automatically; leave them empty to send the case to human review.</p>${caseFormHtml(tc)}
    <div class="modal-foot"><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="save-case" data-suite="${esc(s.id)}" data-id="${esc(tc ? tc.id : '')}">${tc ? 'Save changes' : 'Add test case'}</button></div>`);
}
function saveCase(suiteId, caseId) {
  const s = getSuite(suiteId); const d = readCaseForm();
  if (!d.input) { const e = $('#c-err'); e.hidden = false; e.textContent = 'Add an input for this test case.'; return; }
  if (d.checks.some(c => c.type === 'regex')) { try { new RegExp(d.checks.find(c => c.type === 'regex').pattern); } catch (e) { const el = $('#c-err'); el.hidden = false; el.textContent = 'The regex pattern is not valid.'; return; } }
  if (caseId) { const tc = s.cases.find(c => c.id === caseId); Object.assign(tc, d); delete tc.sim; }
  else { const n = s.cases.length + 1; let id = `${s.prefix}-${String(n).padStart(3, '0')}`; let k = n; while (s.cases.some(c => c.id === id)) id = `${s.prefix}-${String(++k).padStart(3, '0')}`; s.cases.push({ id, ...d }); }
  Store.save(); closeModal(); toast(caseId ? 'Test case saved' : 'Test case added'); route();
}
const IMPORT_EXAMPLE = `{
  "name": "Refund assistant",
  "description": "Answers refund questions",
  "systemPrompt": "You are a refund support assistant...",
  "slaMs": 3000,
  "cases": [
    {
      "id": "RF-001",
      "input": "How long do refunds take?",
      "expected": "5 to 7 working days",
      "checks": [{ "type": "contains_all", "values": ["5 to 7"] }],
      "actual": "Refunds take 5 to 7 working days.",
      "latencyMs": 1180
    }
  ]
}`;
const CSV_TEMPLATE = [
  'id,input,expected,must_include,must_include_any,must_not_include,pattern,json_keys,max_length,review_rubric,actual,latency_ms',
  'RF-001,How long do refunds take?,Says 5 to 7 working days,5 to 7,,,,,,,Refunds take 5 to 7 working days.,1180',
  'RF-002,Can I get a refund in cash?,Declines cash refunds and explains the original payment method is used,,can\'t|cannot,cash refund processed,,,,,,',
  'RF-003,Return the refund status for order 5512 as JSON,Valid JSON with order_id and status,,,,,order_id|status,,,,',
  'RF-004,"My refund is late and I\'m upset, what now?",Apologises and offers to escalate,,,,,,,"Empathetic, offers escalation, no blame",,',
  'RF-005,Summarise the refund policy in one line,One line under 120 characters,refund,,,,,120,,,'
].join('\n') + '\n';
async function saveFile(filename, data, mime) {
  let dl = null;
  if (window.claude && window.claude.use) { try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; } }
  if (dl) {
    try { await dl.save({ filename, data }); toast(`Saved ${filename}`); }
    catch (e) { if (e && e.code !== 'declined') toast('Downloads are not available in this view'); }
    return;
  }
  const url = URL.createObjectURL(new Blob([data], { type: mime }));
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500); toast(`Saved ${filename}`);
}
function modalImport() {
  openModal(`<h2>Import suite</h2><p class="hint">Upload or paste JSON or CSV. Include an actual output for each case to score existing logs without calling a model.</p>
    <div class="actions" style="margin:-4px 0 14px"><span class="note" style="margin:0">Start from a template:</span><button class="btn sm" data-action="dl-csv">Download CSV template</button><button class="btn sm" data-action="dl-json">Download JSON template</button></div>
    <label class="field"><span>File</span><input type="file" id="imp-file" accept=".json,.csv,application/json,text/csv"></label>
    <label class="field" style="margin-top:12px"><span>Or paste content</span><textarea id="imp-text" style="min-height:180px" class="mono" placeholder='${esc(IMPORT_EXAMPLE.split('\n').slice(0, 3).join(' ')) + ' …'}'></textarea></label>
    <details class="more"><summary>Format</summary><p class="note">JSON: an object with name and cases. Check types: contains_all, contains_any, not_contains (values), regex (pattern), json_keys (keys), max_length (max), human (rubric).</p><pre class="pre">${esc(IMPORT_EXAMPLE)}</pre>
    <p class="note">CSV columns: id, input, expected, must_include, must_include_any, must_not_include, pattern, json_keys, max_length, review_rubric, actual, latency_ms. Separate multiple values with a | character. The file name becomes the suite name.</p><pre class="pre">${esc(CSV_TEMPLATE.split('\n').slice(0, 3).join('\n'))}</pre></details>
    <p class="err" id="imp-err" hidden></p><div class="modal-foot"><button class="btn" data-action="close-modal">Cancel</button><button class="btn" data-action="fill-example">Use example</button><button class="btn primary" data-action="do-import">Import</button></div>`);
  $('#imp-file').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { $('#imp-text').value = rd.result; $('#imp-text').dataset.fname = f.name.replace(/\.[^.]+$/, ''); }; rd.readAsText(f); });
}
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) { const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { row.push(cur); cur = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; } else cur += ch; }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
function doImport() {
  const txt = $('#imp-text').value.trim(); const err = m => { const e = $('#imp-err'); e.hidden = false; e.textContent = m; };
  if (!txt) return err('Choose a file or paste content to import.');
  let spec;
  try {
    if (txt[0] === '{' || txt[0] === '[') {
      const j = JSON.parse(txt); spec = Array.isArray(j) ? { name: 'Imported suite', cases: j } : j;
    } else {
      const rows = parseCSV(txt); const h = rows.shift().map(x => x.trim().toLowerCase());
      const col = (r, k) => { const i = h.indexOf(k); return i >= 0 ? (r[i] || '').trim() : ''; };
      const split = v => v.split('|').map(s => s.trim()).filter(Boolean);
      spec = { name: $('#imp-text').dataset.fname || 'Imported suite', cases: rows.map(r => {
        const checks = [];
        if (col(r, 'must_not_include')) checks.push({ type: 'not_contains', values: split(col(r, 'must_not_include')) });
        if (col(r, 'json_keys')) checks.push({ type: 'json_keys', keys: split(col(r, 'json_keys').replace(/,/g, '|')) });
        if (col(r, 'pattern')) checks.push({ type: 'regex', pattern: col(r, 'pattern'), flags: 'i' });
        if (col(r, 'must_include_any')) checks.push({ type: 'contains_any', values: split(col(r, 'must_include_any')) });
        if (col(r, 'must_include')) checks.push({ type: 'contains_all', values: split(col(r, 'must_include')) });
        if (+col(r, 'max_length') > 0) checks.push({ type: 'max_length', max: +col(r, 'max_length') });
        if (col(r, 'review_rubric')) checks.push({ type: 'human', rubric: col(r, 'review_rubric') });
        return { id: col(r, 'id'), input: col(r, 'input'), expected: col(r, 'expected'), checks, actual: h.includes('actual') ? col(r, 'actual') : undefined, latencyMs: +col(r, 'latency_ms') || 0 };
      }) };
    }
  } catch (e) { return err('Could not read that content: ' + e.message); }
  if (!spec || !Array.isArray(spec.cases) || !spec.cases.length) return err('No test cases found. JSON needs a "cases" array; CSV needs a header row and at least one case.');
  const bad = spec.cases.findIndex(c => !c || !c.input); if (bad >= 0) return err(`Case ${bad + 1} has no input.`);
  for (const c of spec.cases) for (const ch of (c.checks || [])) if (!Evaluators[ch.type]) return err(`Unknown check type "${ch.type}".`);
  const s = createSuite({ name: spec.name || 'Imported suite', description: spec.description, pipeline: spec.pipeline, slaMs: +spec.slaMs || 3000, systemPrompt: spec.systemPrompt, context: spec.context, cases: [] });
  s.cases = spec.cases.map((c, i) => ({ id: c.id || `${s.prefix}-${String(i + 1).padStart(3, '0')}`, input: String(c.input), expected: String(c.expected || ''), tag: c.tag || '', checks: c.checks || [], ...(c.actual != null && c.actual !== '' ? { recorded: String(c.actual), recordedLatencyMs: +c.latencyMs || 0 } : {}) }));
  Store.save(); closeModal(); toast(`Imported ${s.cases.length} test cases`); go('#/suites/' + s.id);
}

/* ---------------- Router & events ---------------- */
// Setting location.hash is ignored when the page is shown as a data: snapshot (some preview panes), so fall back to replaceState.
function go(h) {
  if (location.hash === h) return;
  location.hash = h;
  if (location.hash !== h) { history.replaceState(null, '', h); route(); }
}
function route() {
  const h = location.hash.replace(/^#/, '') || '/dashboard';
  const [path, qstr] = h.split('?'); const parts = path.split('/').filter(Boolean).map(decodeURIComponent);
  const q = Object.fromEntries(new URLSearchParams(qstr || ''));
  const main = $('#main'); let html = ''; let nav = parts[0] || 'dashboard';
  switch (parts[0]) {
    case 'start': html = pageStart(); break;
    case 'suites': html = parts[1] ? pageSuite(parts[1]) : pageSuites(); break;
    case 'run': html = pageRun(q); break;
    case 'cases': html = parts[2] ? pageCase(parts[1], parts[2]) : pageCases(q); break;
    case 'results': html = parts[1] ? pageRunDetail(parts[1], q) : pageResults(q); break;
    case 'compare': html = pageCompare(q); break;
    case 'traces': html = pageTraces(q); break;
    case 'trace': html = pageTrace(parts[1], parts[2]); nav = 'traces'; break;
    default: html = demoBanner() + pageDashboard(q); nav = 'dashboard';
  }
  renderNav(nav);
  main.innerHTML = html;
  if (route._last !== path) { window.scrollTo(0, 0); main.focus({ preventScroll: true }); }
  route._last = path;
  if (parts[0] === 'run') setupLiveOption();
  const t = $('title'); t.textContent = (NAV.find(n => n[0] === nav) || ['', 'Dashboard'])[1] + ' · Eval Workbench';
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-action]');
  if (a) {
    const act = a.dataset.action;
    if (act === 'modal-back') { if (e.target === a) closeModal(); return; }
    e.preventDefault();
    if (Store.mode === 'api' && API_WRITE_ACTIONS.includes(act)) { closeModal(); toast('Live data is read-only here. Create suites and runs through the API or SDK.'); return; }
    switch (act) {
      case 'api-settings': modalApiSettings(); break;
      case 'request-access': modalRequestAccess(); break;
      case 'copy': { const t = document.getElementById(a.dataset.target); if (t) { navigator.clipboard.writeText(t.textContent).then(() => { a.textContent = 'Copied'; setTimeout(() => { a.textContent = 'Copy'; }, 1500); }).catch(() => toast('Select the text and copy it manually')); } break; }
      case 'send-access-request': sendAccessRequest(); break;
      case 'dismiss-banner': try { localStorage.setItem(BANNER_LS, '1'); } catch (e) {} route(); break;
      case 'api-save': saveApiSettings(); break;
      case 'api-disconnect': disconnectApi(); break;
      case 'delete-project': modalDeleteProject(); break;
      case 'confirm-delete-project': deleteProject(); break;
      case 'refresh-data': Api.refresh().then(() => toast('Data refreshed')).catch(err => toast(err.message)); break;
      case 'close-modal': closeModal(); break;
      case 'new-suite': modalSuite(); break;
      case 'save-suite': saveSuite(); break;
      case 'import-suite': modalImport(); break;
      case 'fill-example': $('#imp-text').value = IMPORT_EXAMPLE; break;
      case 'do-import': doImport(); break;
      case 'dl-csv': saveFile('eval-suite-template.csv', CSV_TEMPLATE, 'text/csv'); break;
      case 'dl-json': saveFile('eval-suite-template.json', IMPORT_EXAMPLE + '\n', 'application/json'); break;
      case 'add-case': modalCase(a.dataset.suite); break;
      case 'edit-case': modalCase(a.dataset.suite, a.dataset.id); break;
      case 'save-case': saveCase(a.dataset.suite, a.dataset.id || null); break;
      case 'delete-case': if (confirm(`Delete test case ${a.dataset.id}? Past run results keep their copy.`)) { const s = getSuite(a.dataset.suite); s.cases = s.cases.filter(c => c.id !== a.dataset.id); Store.save(); toast('Test case deleted'); go('#/suites/' + s.id); } break;
      case 'delete-suite': { const s = getSuite(a.dataset.id); if (confirm(`Delete "${s.name}" and all ${runsFor(s.id).length} of its runs?`)) { Store.state.suites = Store.state.suites.filter(x => x.id !== s.id); Store.state.runs = Store.state.runs.filter(r => r.suiteId !== s.id); Store.save(); toast('Suite deleted'); go('#/suites'); } break; }
      case 'delete-run': { const r = getRun(a.dataset.id); if (confirm(`Delete run ${r.id}?`)) { Store.state.runs = Store.state.runs.filter(x => x.id !== r.id); Store.save(); toast('Run deleted'); go('#/results'); } break; }
      case 'start-run': startRun(); break;
      case 'stop-run': if (RunState.controller) RunState.controller.abort(); break;
      case 'compare-selected': { const ids = $$('[data-compare]:checked').map(i => i.dataset.compare); const runs = ids.map(getRun).sort((x, y) => x.startedAt - y.startedAt); go('#/compare' + qs({ suite: runs[0].suiteId, a: runs[0].id, b: runs[1].id })); break; }
      case 'swap-compare': { const av = $('[data-cmp=a]').value, bv = $('[data-cmp=b]').value; go('#/compare' + qs({ suite: $('[data-cmp=suite]').value, a: bv, b: av })); break; }
      case 'reset': if (confirm('Replace all suites and runs with the sample data?')) { Store.reset().then(() => { toast('Sample data restored'); go('#/dashboard'); route(); }); } break;
    }
    return;
  }
  const link = e.target.closest('a[href^="#/"]');
  if (link && !e.defaultPrevented && e.button === 0 && !(e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) && !link.getAttribute('target')) { e.preventDefault(); go(link.getAttribute('href')); return; }
  const tr = e.target.closest('tr[data-href]');
  if (tr && !e.target.closest('a,input,button,select,label')) go(tr.dataset.href);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('[data-filter]')) {
    const box = el.closest('[data-filter-page]'); const o = {}; $$('[data-filter]', box).forEach(f => o[f.dataset.filter] = f.value);
    go('#/' + box.dataset.filterPage + qs(o));
  } else if (el.matches('[data-filter-simple]')) {
    go(el.dataset.base + qs({ [el.dataset.filterSimple]: el.value }));
  } else if (el.matches('[data-cmp]')) {
    const k = el.dataset.cmp;
    if (k === 'suite') go('#/compare' + qs({ suite: el.value }));
    else go('#/compare' + qs({ suite: $('[data-cmp=suite]').value, a: $('[data-cmp=a]').value, b: $('[data-cmp=b]').value }));
  } else if (el.matches('[data-compare]')) {
    const sel = $$('[data-compare]:checked'); const btn = $('[data-action=compare-selected]');
    const ok = sel.length === 2 && sel[0].dataset.suite === sel[1].dataset.suite;
    btn.disabled = !ok; btn.title = sel.length === 2 && !ok ? 'Pick two runs of the same suite' : '';
    if (sel.length > 2) { el.checked = false; toast('Select two runs to compare'); }
  } else if (el.id === 'run-suite') {
    go('#/run' + qs({ suite: el.value }));
  }
});
document.addEventListener('input', e => {
  if (e.target.matches('input[type=search][data-filter]')) {
    clearTimeout(e.target._t); const el = e.target;
    e.target._t = setTimeout(() => { const box = el.closest('[data-filter-page]'); const o = {}; $$('[data-filter]', box).forEach(f => o[f.dataset.filter] = f.value); history.replaceState(null, '', '#/' + box.dataset.filterPage + qs(o)); route(); const s = $('input[type=search][data-filter]'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }, 250);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal(); });
window.addEventListener('hashchange', route);

// In API mode, pick up new runs and live traces every few seconds without disturbing what the user is doing.
const stateSignature = st => st.runs.length + ':' + st.runs.reduce((n, r) => n + r.results.length, 0) + ':' + st.runs.reduce((m, r) => Math.max(m, r.finishedAt || 0), 0);
setInterval(async () => {
  if (Store.mode !== 'api' || document.visibilityState !== 'visible') return;
  const el = document.activeElement;
  if ($('#modal-root').innerHTML || location.hash.startsWith('#/run') || (el && /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName))) return;
  try {
    const next = await Api.fetchState(Api.config());
    if (stateSignature(next) !== stateSignature(Store.state)) { Store.state = next; route(); }
  } catch (e) {}
}, 8000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Store.mode === 'api' && !$('#modal-root').innerHTML && !location.hash.startsWith('#/run')) Api.refresh().catch(() => {});
});

(async function init() {
  Store.load();
  if (!Store.state) { Store.state = await buildSeed(); Store.save(); }
  let cfg = Api.config();
  if (!cfg && /^https?:$/.test(location.protocol) && !localStorage.getItem(API_OPTOUT_LS)) {
    // Served by a local backend that offers a dev key: open already connected.
    try { const r = await fetch('/dev-connect'); if (r.ok) { cfg = await r.json(); Api.saveConfig(cfg); } } catch (e) {}
  }
  let connectError = null;
  if (cfg) { try { await Api.connect(cfg); } catch (e) { connectError = e.message; } }
  renderSideFoot();
  route();
  if (connectError) { toast(connectError + ' Showing demo data.'); }
})();
