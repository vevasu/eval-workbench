    <div class="ink2" style="margin-top:6px">${esc(p.b.input)}</div>${kind !== 'lat' ? `<p class="note" style="margin-top:4px">${esc((kind === 'fix' ? p.a : p.b).reason)}</p>` : ''}
    <div class="side-by-side"><div><h4>${esc(a.version)} · <a href="${traceHref(a.id, p.caseId)}">trace</a></h4><pre class="pre">${esc(p.a.actual)}</pre></div><div><h4>${esc(b.version)} · <a href="${traceHref(b.id, p.caseId)}">trace</a></h4><pre class="pre">${esc(p.b.actual)}</pre></div></div></div>`;
  const section = (title, hint, arr, kind) => `<div class="panel"><h2>${title} <span class="muted" style="font-weight:500">(${arr.length})</span></h2><p class="hint">${hint}</p>${arr.length ? arr.map(p => item(p, kind)).join('') : '<p class="muted" style="margin:0">None.</p>'}</div>`;
  return head('Compare runs', 'See what changed between two versions: regressions, fixes, failure causes and latency.', '', '') + picker +
    `<div class="panel"><p style="margin:0 0 4px;font-size:16px">${verdictLine}</p><p class="hint">${esc(a.version)} (${esc(a.model)}) → ${esc(b.version)} (${esc(b.model)})${b.note ? '. What changed: ' + esc(b.note) : ''}</p>
      <div class="delta-grid">
        <div class="delta-card"><div class="l">Pass rate</div><div class="v">${fmtPct(sb.passRate)}</div><div class="d">${deltaPts(sb.passRate - sa.passRate)} from ${fmtPct(sa.passRate)}</div></div>
        <div class="delta-card"><div class="l">Regressions</div><div class="v ${c.regressions.length ? 'down' : ''}">${c.regressions.length}</div><div class="d muted">pass → fail${c.degraded.length ? `, plus ${c.degraded.length} pass → review` : ''}</div></div>
        <div class="delta-card"><div class="l">Fixed</div><div class="v ${c.fixes.length ? 'up' : ''}">${c.fixes.length}</div><div class="d muted">fail or review → pass</div></div>
        <div class="delta-card"><div class="l">Still failing</div><div class="v">${c.stillFailing.length}</div><div class="d muted">failed in both runs</div></div>
        <div class="delta-card"><div class="l">p50 latency</div><div class="v">${fmtMs(sb.p50)}</div><div class="d">${deltaMs(sb.p50 - sa.p50)}</div></div>
        <div class="delta-card"><div class="l">p95 latency</div><div class="v">${fmtMs(sb.p95)}</div><div class="d">${deltaMs(sb.p95 - sa.p95)}</div></div>
      </div></div>
    <div class="grid2"><div class="stack">${section('Regressions', 'Passed in the baseline and fail or need review in the candidate.', [...c.regressions, ...c.degraded], 'reg')}${section('Fixed', 'Did not pass in the baseline and pass now.', c.fixes, 'fix')}${section('Still failing', 'Failed in both runs.', c.stillFailing, 'still')}</div>
      <div class="stack"><div class="panel"><h2>Failure causes</h2><p class="hint">Failed cases per category in each run.</p>${catKeys.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Category</th><th class="num">${esc(a.version)}</th><th class="num">${esc(b.version)}</th><th class="num">Change</th></tr></thead><tbody>${catKeys.map(k => { const d = (sb.cats[k] || 0) - (sa.cats[k] || 0); return `<tr><td>${esc(k)}</td><td class="num">${sa.cats[k] || 0}</td><td class="num">${sb.cats[k] || 0}</td><td class="num ${d > 0 ? 'down' : d < 0 ? 'up' : 'flat'}">${d > 0 ? '+' + d : d}</td></tr>`; }).join('')}</tbody></table></div>` : '<p class="muted">No failures in either run.</p>'}</div>
      ${section('Slower cases', 'At least 30% and 300 ms slower in the candidate.', c.latency, 'lat')}</div></div>`;
}
function suitePicker(suite) { return `<div class="panel"><label class="field" style="width:260px"><span>Suite</span><select data-cmp="suite">${Store.state.suites.map(s => `<option value="${esc(s.id)}" ${s.id === suite.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label></div>`; }

/* Production */
function liveWindow(q) { const w = LIVE_WINDOWS[q.w] ? q.w : '7d'; const to = Prod.now(); return { w, ...LIVE_WINDOWS[w], to, from: to - LIVE_WINDOWS[w].ms }; }
const liveTracesHref = o => '#/traces' + qs({ src: 'live', ...o });
function loadingPanel(msg) { return `<div class="panel empty" aria-busy="true"><p class="muted" style="margin:0">${esc(msg || 'Loading…')}</p></div>`; }
function errorPanel(msg) { return `<div class="panel empty"><h3>Could not load production data</h3><p>${esc(msg)}</p><button class="btn" data-action="retry-live">Try again</button></div>`; }
function liveEmpty() {
  const code = `from eval_workbench import Client

client = Client()   # EVAL_WORKBENCH_URL and EVAL_WORKBENCH_API_KEY from the environment

def handle_request(user_input, user_id, conversation_id):
    return client.observe("support-bot", my_app, user_input, suite_name="Support bot",
                          version="v1", model="gpt-4o", user_id=user_id, session_id=conversation_id,

  return `<div class="panel"><h2>No production traffic yet</h2><p class="hint">Wrap the function that handles a real request with <span class="mono">client.observe()</span>. Each request then appears here with its steps, timing, tokens and result. Sending never slows or breaks your app.</p>${codeBlock('c-observe', code)}<div class="cta-row"><a class="btn" href="#/start">Full setup guide</a>${Store.mode === 'demo' ? '<button class="btn" data-action="reset">Restore sample data to see an example</button>' : ''}</div></div>`;
}
function pageProduction(q) {

function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) { const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { row.push(cur); cur = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; } else cur += ch; }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}

        if (col(r, 'pattern')) checks.push({ type: 'regex', pattern: col(r, 'pattern'), flags: 'i' });

        if (col(r, 'must_include')) checks.push({ type: 'contains_all', values: split(col(r, 'must_include')) });

        if (col(r, 'review_rubric')) checks.push({ type: 'human', rubric: col(r, 'review_rubric') });
        return { id: col(r, 'id'), input: col(r, 'input'), expected: col(r, 'expected'), checks, actual: h.includes('actual') ? col(r, 'actual') : undefined, latencyMs: +col(r, 'latency_ms') || 0 };

    const s = await Api.request('POST', '/suites/import', { format: json ? 'json' : 'csv', content: txt, name: json ? null : spec.name });
    closeModal(); await Api.refresh(); toast(`Imported ${s.cases.length} test cases`); go('#/suites/' + enc(s.id));
  }, '#imp-err', $('[data-action=do-import]'));
  const s = createSuite({ name: spec.name || 'Imported suite', description: spec.description, pipeline: spec.pipeline, slaMs: +spec.slaMs || 3000, systemPrompt: spec.systemPrompt, context: spec.context, cases: [] });
  s.cases = spec.cases.map((c, i) => ({ id: c.id || `${s.prefix}-${String(i + 1).padStart(3, '0')}`, input: String(c.input), expected: String(c.expected || ''), tag: c.tag || '', checks: c.checks || [], ...(c.actual != null && c.actual !== '' ? { recorded: String(c.actual), recordedLatencyMs: +c.latencyMs || 0 } : {}) }));
  Store.save(); closeModal(); toast(`Imported ${s.cases.length} test cases`); go('#/suites/' + s.id);
}

/* ---------------- Router & events ---------------- */
// Setting location.hash is ignored when the page is shown as a data: snapshot (some preview panes), so fall back to replaceState.
function go(h) {
  if (location.hash === h) return;
  location.hash = h;
  if (location.hash !== h) { history.replaceState(null, '', h); route(); }
}
function route() {
  const h = location.hash.replace(/^#/, '') || '/dashboard';
  const [path, qstr] = h.split('?'); const parts = path.split('/').filter(Boolean).map(decodeURIComponent);
  const q = Object.fromEntries(new URLSearchParams(qstr || ''));
  const main = $('#main'); let html = ''; let nav = parts[0] || 'dashboard';
  Prod.beginRender();
  switch (parts[0]) {
    case 'start': html = pageStart(); break;
    case 'production': html = pageProduction(q); break;
    case 'suites': html = parts[1] ? pageSuite(parts[1]) : pageSuites(); break;
    case 'run': html = pageRun(q); break;
    case 'cases': html = parts[2] ? pageCase(parts[1], parts[2]) : pageCases(q); break;
    case 'results': html = parts[1] ? pageRunDetail(parts[1], q) : pageResults(q); break;
    case 'compare': html = pageCompare(q); break;
    case 'traces': html = pageTraces(q); break;
    case 'review': html = parts[1] ? pageReviewItem(parts[1], parts[2], q) : pageReviewQueue(q); nav = 'review'; break;
    case 'trace': html = pageTrace(parts[1], parts[2]); nav = 'traces'; break;
    default: html = demoBanner() + pageDashboard(q); nav = 'dashboard';
  }
  Prod.endRender();
  renderNav(nav);
  main.innerHTML = html;
  if (route._last !== path) { window.scrollTo(0, 0); main.focus({ preventScroll: true }); }
  route._last = path;
  if (parts[0] === 'run') setupLiveOption();
  const t = $('title'); t.textContent = (NAV.find(n => n[0] === nav) || ['', 'Dashboard'])[1] + ' · Eval Workbench';
}

// Re-render after data arrives in the background, keeping the caret in a search box the user is typing in.
function rerender() {
  const el = document.activeElement; const typing = el && el.matches && el.matches('input[type=search][data-filter]') ? [el.selectionStart, el.selectionEnd] : null;
  route();
  if (typing) { const s = $('input[type=search][data-filter]'); if (s) { s.focus(); s.setSelectionRange(typing[0], typing[1]); } }
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-action]');
  if (a) {
    const act = a.dataset.action;
    if (act === 'modal-back') { if (e.target === a) closeModal(); return; }
    e.preventDefault();
    if (Store.mode === 'api' && API_WRITE_ACTIONS.includes(act)) { closeModal(); toast(act === 'reset' ? 'Sample data can only be restored in demo mode.' : 'In live data mode, runs come from your app through the SDK.'); return; }
    switch (act) {
      case 'api-settings': modalApiSettings(); break;
      case 'request-access': modalRequestAccess(); break;
      case 'copy': { const t = document.getElementById(a.dataset.target); if (t) { navigator.clipboard.writeText(t.textContent).then(() => { a.textContent = 'Copied'; setTimeout(() => { a.textContent = 'Copy'; }, 1500); }).catch(() => toast('Select the text and copy it manually')); } break; }
      case 'send-access-request': sendAccessRequest(); break;
      case 'dismiss-banner': try { localStorage.setItem(BANNER_LS, '1'); } catch (e) {} route(); break;
      case 'api-save': saveApiSettings(); break;
      case 'api-disconnect': disconnectApi(); break;
      case 'delete-project': modalDeleteProject(); break;
      case 'confirm-delete-project': deleteProject(); break;
      case 'refresh-data': Api.refresh().then(() => toast('Data refreshed')).catch(err => toast(err.message)); break;
      case 'close-modal': closeModal(); break;
      case 'retry-live': Prod.clear(); route(); break;
      case 'promote-trace': modalPromote(a.dataset.run, a.dataset.case); break;
      case 'save-promote': savePromote(a.dataset.run, a.dataset.case, a); break;
      case 'save-review': saveReview(a); break;
      case 'live-checks': modalLiveChecks(a.dataset.suite); break;
      case 'save-live-checks': saveLiveChecks(a.dataset.suite, a); break;
      case 'judge-key': modalJudgeKey(); break;
      case 'save-judge-key': saveJudgeKey(a); break;
      case 'remove-judge-key': if (confirm('Remove the saved model key? The AI judge stops until you add another.')) apiWrite(async () => { await Api.request('DELETE', '/settings/judge'); Prod.clear(); closeModal(); toast('Model key removed'); route(); }); break;
      case 'undo-review': undoReviewAction(a); break;
      case 'new-suite': modalSuite(); break;
      case 'save-suite': saveSuite(); break;
      case 'import-suite': modalImport(); break;
      case 'fill-example': $('#imp-text').value = IMPORT_EXAMPLE; break;
      case 'do-import': doImport(); break;
      case 'dl-csv': saveFile('eval-suite-template.csv', CSV_TEMPLATE, 'text/csv'); break;
      case 'dl-json': saveFile('eval-suite-template.json', IMPORT_EXAMPLE + '\n', 'application/json'); break;
      case 'add-case': modalCase(a.dataset.suite); break;
      case 'edit-case': modalCase(a.dataset.suite, a.dataset.id); break;
      case 'save-case': saveCase(a.dataset.suite, a.dataset.id || null); break;
      case 'delete-case': if (confirm(`Delete test case ${a.dataset.id}? Past run results keep their copy.`)) { if (Store.mode === 'api') { apiWrite(async () => { await Api.request('DELETE', `/suites/${enc(a.dataset.suite)}/cases/${enc(a.dataset.id)}`); await Api.refresh(); toast('Test case deleted'); go('#/suites/' + enc(a.dataset.suite)); }); break; } const s = getSuite(a.dataset.suite); s.cases = s.cases.filter(c => c.id !== a.dataset.id); Store.save(); toast('Test case deleted'); go('#/suites/' + s.id); } break;
      case 'delete-suite': { const s = getSuite(a.dataset.id); if (confirm(`Delete "${s.name}" and all ${runsFor(s.id).length} of its runs${Store.mode === 'api' ? ', and any production traffic recorded for it' : ''}? This cannot be undone.`)) { if (Store.mode === 'api') { apiWrite(async () => { await Api.request('DELETE', `/suites/${enc(s.id)}`); await Api.refresh(); toast('Suite deleted'); go('#/suites'); }); break; } Store.state.suites = Store.state.suites.filter(x => x.id !== s.id); Store.state.runs = Store.state.runs.filter(r => r.suiteId !== s.id); Store.save(); toast('Suite deleted'); go('#/suites'); } break; }
      case 'delete-run': { const r = getRun(a.dataset.id); if (confirm(`Delete run ${r.id}?`)) { if (Store.mode === 'api') { apiWrite(async () => { await Api.request('DELETE', `/runs/${enc(r.id)}`); await Api.refresh(); toast('Run deleted'); go('#/results'); }); break; } Store.state.runs = Store.state.runs.filter(x => x.id !== r.id); Store.save(); toast('Run deleted'); go('#/results'); } break; }
      case 'start-run': startRun(); break;
      case 'stop-run': if (RunState.controller) RunState.controller.abort(); break;
      case 'compare-selected': { const ids = $$('[data-compare]:checked').map(i => i.dataset.compare); const runs = ids.map(getRun).sort((x, y) => x.startedAt - y.startedAt); go('#/compare' + qs({ suite: runs[0].suiteId, a: runs[0].id, b: runs[1].id })); break; }
      case 'swap-compare': { const av = $('[data-cmp=a]').value, bv = $('[data-cmp=b]').value; go('#/compare' + qs({ suite: $('[data-cmp=suite]').value, a: bv, b: av })); break; }
      case 'reset': if (confirm('Replace all suites and runs with the sample data?')) { Store.reset().then(() => { toast('Sample data restored'); go('#/dashboard'); route(); }); } break;
    }
    return;
  }
  const link = e.target.closest('a[href^="#/"]');
  if (link && !e.defaultPrevented && e.button === 0 && !(e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) && !link.getAttribute('target')) { e.preventDefault(); go(link.getAttribute('href')); return; }
  const tr = e.target.closest('tr[data-href]');
  if (tr && !e.target.closest('a,input,button,select,label')) go(tr.dataset.href);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('[data-filter]')) {
    const box = el.closest('[data-filter-page]'); const o = {}; $$('[data-filter]', box).forEach(f => o[f.dataset.filter] = f.value);
    go('#/' + box.dataset.filterPage + qs(o));
  } else if (el.matches('[data-filter-simple]')) {
    go(el.dataset.base + qs({ [el.dataset.filterSimple]: el.value }));
  } else if (el.matches('[data-cmp]')) {
    const k = el.dataset.cmp;
    if (k === 'suite') go('#/compare' + qs({ suite: el.value }));
    else go('#/compare' + qs({ suite: $('[data-cmp=suite]').value, a: $('[data-cmp=a]').value, b: $('[data-cmp=b]').value }));
  } else if (el.matches('[data-compare]')) {
    const sel = $$('[data-compare]:checked'); const btn = $('[data-action=compare-selected]');
    const ok = sel.length === 2 && sel[0].dataset.suite === sel[1].dataset.suite;
    btn.disabled = !ok; btn.title = sel.length === 2 && !ok ? 'Pick two runs of the same suite' : '';
    if (sel.length > 2) { el.checked = false; toast('Select two runs to compare'); }
  } else if (el.name === 'rv-verdict') {
    $('#rv-cat-wrap').hidden = el.value !== 'Fail';
  } else if (el.id === 'run-suite') {
    go('#/run' + qs({ suite: el.value }));
  }
});
document.addEventListener('input', e => {
  if (e.target.matches('input[type=search][data-filter]')) {
    clearTimeout(e.target._t); const el = e.target;
    e.target._t = setTimeout(() => { const box = el.closest('[data-filter-page]'); const o = {}; $$('[data-filter]', box).forEach(f => o[f.dataset.filter] = f.value); history.replaceState(null, '', '#/' + box.dataset.filterPage + qs(o)); route(); const s = $('input[type=search][data-filter]'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }, 250);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal(); });
window.addEventListener('hashchange', route);

// In API mode, pick up new runs and live traces every few seconds without disturbing what the user is doing.
const stateSignature = st => st.runs.length + ':' + st.runs.reduce((n, r) => n + r.results.length, 0) + ':' + st.runs.reduce((m, r) => Math.max(m, r.finishedAt || 0), 0);
setInterval(async () => {
  if (Store.mode !== 'api' || document.visibilityState !== 'visible') return;
  const el = document.activeElement;
  if ($('#modal-root').innerHTML || location.hash.startsWith('#/run') || (el && /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName))) return;
  try {
    const next = await Api.fetchState(Api.config());
    if (stateSignature(next) !== stateSignature(Store.state)) { Store.state = next; route(); }
    else await Prod.refresh();
  } catch (e) {}
}, 8000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Store.mode === 'api' && !$('#modal-root').innerHTML && !location.hash.startsWith('#/run')) Api.refresh().catch(() => {});
});

(async function init() {
  Store.load();
  if (!Store.state) { Store.state = await buildSeed(); Store.save(); }
  let cfg = Api.config();
  if (!cfg && /^https?:$/.test(location.protocol) && !localStorage.getItem(API_OPTOUT_LS)) {
    // Served by a local backend that offers a dev key: open already connected.
    try { const r = await fetch('/dev-connect'); if (r.ok) { cfg = await r.json(); Api.saveConfig(cfg); } } catch (e) {}
  }
  let connectError = null;
  if (cfg) { try { await Api.connect(cfg); } catch (e) { connectError = e.message; } }
  renderSideFoot();
  route();
  if (connectError) { toast(connectError + ' Showing demo data.'); }
})();
</script>
