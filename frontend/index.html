<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eval Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#F7F9F8; --ink:#16212C; --ink-2:#465461; --ink-3:#77838E;
  --line:#D9DFDD; --line-2:#E9EDEC;
  --side:#15233B; --side-ink:#C9D3E3; --side-ink-strong:#FFFFFF; --side-active:#22365A;
  --accent:#2C4DA0; --accent-ink:#FFFFFF; --accent-soft:#E5EBF8;
  --pass:#16825A; --pass-soft:#DFF2E8; --fail:#C13A22; --fail-soft:#FAE5E0; --review:#A86F0E; --review-soft:#F9EDD6;
  --s1:#2C4DA0; --s2:#0E8487; --s3:#8A4CBD; --s4:#B5552B; --s5:#4F6B2C;
  --focus:#2C4DA0;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141A; --surface:#151D25; --surface-2:#19232C; --ink:#E4E9EE; --ink-2:#A7B2BC; --ink-3:#7B8792;
    --line:#26323D; --line-2:#1E2932;
    --side:#0A1017; --side-ink:#9FB0C4; --side-ink-strong:#FFFFFF; --side-active:#1A2638;
    --accent:#86A2F2; --accent-ink:#0E141A; --accent-soft:#1D2944;
    --pass:#46C08E; --pass-soft:#12301F; --fail:#F17A60; --fail-soft:#3A1B14; --review:#E3AD45; --review-soft:#352710;
    --s1:#86A2F2; --s2:#3FC3C5; --s3:#C08FEA; --s4:#EE9466; --s5:#A6C76F; --focus:#86A2F2;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#151D25; --surface-2:#19232C; --ink:#E4E9EE; --ink-2:#A7B2BC; --ink-3:#7B8792;
  --line:#26323D; --line-2:#1E2932;
  --side:#0A1017; --side-ink:#9FB0C4; --side-ink-strong:#FFFFFF; --side-active:#1A2638;
  --accent:#86A2F2; --accent-ink:#0E141A; --accent-soft:#1D2944;
  --pass:#46C08E; --pass-soft:#12301F; --fail:#F17A60; --fail-soft:#3A1B14; --review:#E3AD45; --review-soft:#352710;
  --s1:#86A2F2; --s2:#3FC3C5; --s3:#C08FEA; --s4:#EE9466; --s5:#A6C76F; --focus:#86A2F2;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--ink-3)}
.ink2{color:var(--ink-2)}
.nowrap{white-space:nowrap}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:22px 12px 16px;position:sticky;top:0;align-self:start;height:100vh;height:100dvh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px;color:var(--side-ink-strong);font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand svg{flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--side-ink);font-weight:500}
.nav a:hover{background:var(--side-active);text-decoration:none;color:var(--side-ink-strong)}
.nav a.active{background:var(--side-active);color:var(--side-ink-strong);box-shadow:inset 3px 0 0 var(--accent)}
.nav svg{width:16px;height:16px;flex:none;opacity:.85}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.08);font-size:12px;line-height:1.45}
.side-foot button{background:none;border:1px solid rgba(255,255,255,.18);color:var(--side-ink);border-radius:6px;padding:5px 9px;margin-top:8px;cursor:pointer;font-size:12px}
.side-foot button:hover{color:#fff;border-color:rgba(255,255,255,.4)}
.side-foot .side-link{display:inline-block;margin-top:10px;color:var(--side-ink);font-size:12px}.side-foot .side-link:hover{color:#fff}
.side-foot .mode{display:flex;align-items:center;gap:6px;font-weight:600;color:#fff}
.side-foot .mode i{width:8px;height:8px;border-radius:50%;background:#E3AD45;display:inline-block}
.side-foot .mode.live i{background:#46C08E}
.side-foot .row{display:flex;gap:6px;flex-wrap:wrap}
.banner{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand,#1F3A68);border-radius:10px;padding:14px 16px;margin:0 0 16px}
.banner h2{margin:0 0 4px;font-size:16px}.banner p{margin:0 0 10px;color:var(--ink-2);font-size:14px}.banner .actions{display:flex;gap:8px;flex-wrap:wrap}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.codeblock{position:relative}.codeblock .btn{position:absolute;top:8px;right:8px}.codeblock .pre{padding-right:70px;white-space:pre;word-break:normal;overflow:auto}
.steps .panel h2{display:flex;gap:10px;align-items:center}.steps .num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:13px;flex:none}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

main{padding:28px 32px 60px;min-width:0;outline:none}
.crumbs{font-size:13px;color:var(--ink-3);margin-bottom:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumbs a{color:var(--ink-2)}
.crumbs .sep{opacity:.5}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:26px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.02em}
.page-head .sub{color:var(--ink-2);margin:6px 0 0;max-width:70ch}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--fail)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12.5px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.panel + .panel,.stack > * + *{margin-top:18px}
.panel h2{font-size:15px;margin:0 0 4px;font-weight:700;letter-spacing:-.005em}
.panel .hint{color:var(--ink-3);font-size:13px;margin:0 0 14px}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.panel-head .hint{margin:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;margin-top:18px}
.grid2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.grid2 > .panel + .panel{margin-top:0}

/* Hero: the three questions */
.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.answer{padding:20px 22px 18px;border-left:1px solid var(--line-2)}
.answer:first-child{border-left:0}
.answer .q{color:var(--ink-3);font-size:13.5px;font-weight:500;margin:0 0 8px}
.answer .a{font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:0}
.answer .why{margin:8px 0 0;color:var(--ink-2);font-size:13.5px}
.answer .go{display:inline-block;margin-top:10px;font-weight:600;font-size:13px}
.up{color:var(--pass)} .down{color:var(--fail)} .flat{color:var(--ink-3)}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.kpi{padding:14px 18px;border-left:1px solid var(--line-2);min-width:0}
.kpi:first-child{border-left:0}
.kpi .l{color:var(--ink-3);font-size:12.5px}
.kpi .v{font-size:20px;font-weight:700;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;margin-top:2px}
.pfr{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:8px;background:var(--line-2)}
.pfr span{display:block}
.pfr .p{background:var(--pass)} .pfr .f{background:var(--fail)} .pfr .r{background:var(--review)}
.pfr-legend{display:flex;gap:10px;font-size:12.5px;margin-top:4px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pfr-legend b{font-weight:600}

.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:20px}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.pass{background:var(--pass-soft);color:var(--pass)}
.chip.fail{background:var(--fail-soft);color:var(--fail)}
.chip.review{background:var(--review-soft);color:var(--review)}
.chip.neutral{background:var(--line-2);color:var(--ink-2)}
.chip.neutral::before{display:none}
.tag{display:inline-block;padding:0 7px;border:1px solid var(--line);border-radius:5px;font-size:12px;color:var(--ink-2);line-height:20px;white-space:nowrap}

.tbl-wrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;color:var(--ink-3);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr[data-href]{cursor:pointer}
.tbl tr[data-href]:hover td{background:var(--surface-2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .clip{max-width:320px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.hist{display:inline-flex;gap:3px;vertical-align:middle}
.hist i{width:10px;height:10px;border-radius:2px;display:block;background:var(--line)}
.hist i.pass{background:var(--pass)} .hist i.fail{background:var(--fail)} .hist i.review{background:var(--review)}

/* matrix: the signature view */
.matrix-wrap{overflow-x:auto;margin:0 -20px;padding:0 20px 4px}
.matrix{display:grid;gap:4px;align-items:center;min-width:max-content}
.matrix .rh{font-family:var(--mono);font-size:12px;color:var(--ink-2);padding-right:12px;white-space:nowrap}
.matrix .rh span{color:var(--ink-3);font-family:var(--sans);font-size:12.5px;margin-left:8px;display:inline-block;max-width:260px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.matrix .ch{font-size:12px;color:var(--ink-3);text-align:center;line-height:1.25;padding-bottom:4px}
.matrix .ch b{display:block;color:var(--ink);font-weight:600}
.cell{display:block;height:24px;min-width:56px;border-radius:4px;background:var(--line-2);position:relative}
.cell.pass{background:var(--pass-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pass) 25%,transparent)}
.cell.fail{background:var(--fail)}
.cell.review{background:var(--review-soft);box-shadow:inset 0 0 0 1px var(--review)}
.cell.regress::after{content:"";position:absolute;inset:-3px;border:2px solid var(--fail);border-radius:6px}
.cell:hover{filter:brightness(.95);outline:2px solid var(--ink-3);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:2px;display:inline-block}

.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs a,.tabs button{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:600;cursor:pointer}
.tabs a:hover,.tabs button:hover{text-decoration:none;border-color:var(--ink-3)}
.tabs .on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px}
.bar-row a{color:var(--ink)}
.bar-track{height:10px;background:var(--line-2);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:var(--fail);border-radius:3px}
.bar-row .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}

.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--sans);font-size:11px;fill:var(--ink-3)}
.chart .gl{stroke:var(--line-2)}
.chart .ax{stroke:var(--line)}
.series-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.series-legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field > span{font-size:12.5px;color:var(--ink-2);font-weight:600}
.field small{color:var(--ink-3);font-size:12px}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-width:0;width:100%}
select{padding-right:28px}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}

.io{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.io .box h3{font-size:12.5px;color:var(--ink-3);margin:0 0 6px;font-weight:600}
.io pre,.pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12.5px;line-height:1.55;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:12px 14px;max-height:320px;overflow:auto}
.io .actual.fail pre{border-color:color-mix(in srgb,var(--fail) 45%,transparent)}
.io .actual.pass pre{border-color:color-mix(in srgb,var(--pass) 45%,transparent)}
.io .actual.review pre{border-color:color-mix(in srgb,var(--review) 55%,transparent)}

.verdict-banner{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;border-radius:10px;margin-bottom:18px;border:1px solid}
.verdict-banner.fail{background:var(--fail-soft);border-color:color-mix(in srgb,var(--fail) 35%,transparent)}
.verdict-banner.pass{background:var(--pass-soft);border-color:color-mix(in srgb,var(--pass) 35%,transparent)}
.verdict-banner.review{background:var(--review-soft);border-color:color-mix(in srgb,var(--review) 40%,transparent)}
.verdict-banner .big{font-size:18px;font-weight:700;letter-spacing:-.01em}
.verdict-banner p{margin:2px 0 0;color:var(--ink-2)}

.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 18px}
.meta div{min-width:0}
.meta dt{font-size:12px;color:var(--ink-3)}
.meta dd{margin:2px 0 0;font-weight:600;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}

.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;font-size:13.5px}
.checks .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.checks .ic.ok{background:var(--pass-soft);color:var(--pass)}
.checks .ic.no{background:var(--fail-soft);color:var(--fail)}
.checks .ic.part{background:var(--review-soft);color:var(--review)}
.checks .ic.skip{background:var(--line-2);color:var(--ink-3)}
.checks b{font-weight:600}

.wf{display:flex;flex-direction:column;gap:6px;font-size:13px}
.wf-row{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr) 72px;gap:10px;align-items:center}
.wf-name{font-family:var(--mono);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf-track{position:relative;height:16px;background:var(--surface-2);border-radius:3px}
.wf-bar{position:absolute;top:2px;bottom:2px;border-radius:3px;background:var(--accent);min-width:2px}
.wf-bar.k-llm{background:var(--s1)} .wf-bar.k-tool{background:var(--s2)} .wf-bar.k-retrieval{background:var(--s3)} .wf-bar.k-root{background:var(--ink-3)} .wf-bar.k-other{background:var(--line)}
.wf-attrs{grid-column:1/-1;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin:-2px 0 4px;padding-left:12px;border-left:2px solid var(--line-2)}
.wf-dur{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}

.delta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.delta-card{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:var(--surface)}
.delta-card .l{font-size:12.5px;color:var(--ink-3)}
.delta-card .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.delta-card .d{font-size:12.5px}
a.delta-card{display:block;color:inherit}
.rv{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.rv::before{content:"✓ "}
a.delta-card:hover{text-decoration:none;border-color:var(--ink-3)}
.kpi .v a{color:inherit}
.side-by-side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.side-by-side h4{margin:0 0 4px;font-size:12px;color:var(--ink-3);font-weight:600}
.cmp-item{padding:14px 0;border-top:1px solid var(--line-2)}
.cmp-item:first-of-type{border-top:0;padding-top:4px}
.cmp-item .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.empty{padding:36px 20px;text-align:center;color:var(--ink-2)}
.empty h3{margin:0 0 6px;color:var(--ink);font-size:16px}

.progress{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden;margin:10px 0 6px}
.progress > div{height:100%;background:var(--accent);transition:width .2s}
.radio-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.radio-card{border:1px solid var(--line);border-radius:9px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:var(--surface)}
.radio-card:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.radio-card:has(input:disabled){opacity:.55;cursor:not-allowed}
.radio-card b{display:block;font-size:13.5px}
.radio-card small{color:var(--ink-2);font-size:12.5px;line-height:1.4;display:block;margin-top:2px}
.radio-card input{margin-top:3px}
details.more{margin-top:12px}
details.more summary{cursor:pointer;color:var(--ink-2);font-weight:600;font-size:13px}

.modal-back{position:fixed;inset:0;background:rgba(10,16,24,.45);display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:var(--surface);border-radius:12px;border:1px solid var(--line);width:min(720px,100%);max-height:calc(100% - 40px);overflow:auto;padding:22px 24px}
.modal h2{margin:0 0 4px;font-size:18px}
.modal .hint{color:var(--ink-3);margin:0 0 16px;font-size:13px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

}

<body>
<div class="app">
  <aside class="side" aria-label="Main navigation">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="6" height="6" rx="1.5" fill="#46C08E"/><rect x="9" y="2" width="6" height="6" rx="1.5" fill="#46C08E"/><rect x="16" y="2" width="6" height="6" rx="1.5" fill="#F17A60"/><rect x="2" y="9" width="6" height="6" rx="1.5" fill="#46C08E"/><rect x="9" y="9" width="6" height="6" rx="1.5" fill="#E3AD45"/><rect x="16" y="9" width="6" height="6" rx="1.5" fill="#46C08E"/><rect x="2" y="16" width="6" height="6" rx="1.5" fill="#46C08E"/><rect x="9" y="16" width="6" height="6" rx="1.5" fill="#46C08E"/><rect x="16" y="16" width="6" height="6" rx="1.5" fill="#46C08E"/></svg>
      <span>Eval Workbench</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================================
   Eval Workbench — MVP
   Modules (kept separate so later capabilities plug in without rewrites):
     Util        formatting, PRNG, helpers
     Taxonomy    failure categories
     Evaluators  check registry (add custom / LLM-judge evaluators here)
     Targets     adapters that invoke the system under test
     Telemetry   span/trace construction
     Analytics   summaries, run comparison, regressions
     Store       persistence (swap for a backend later)
     Seed        realistic sample suites and run history
     Views       one render function per page, hash router
   ========================================================================= */

/* ---------------- Util ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s ?? '').toLowerCase().replace(/[\u2018\u2019]/g, "'").replace(/\s+/g, ' ');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtPct = v => (v * 100).toFixed(1) + '%';
const fmtPct0 = v => Math.round(v * 100) + '%';
const fmtMs = v => v == null || isNaN(v) ? '–' : v >= 1000 ? (v / 1000).toFixed(2) + ' s' : Math.round(v) + ' ms';
const fmtDate = ts => new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const fmtDateTime = ts => new Date(ts).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
function hash(str) { let h = 2166136261; for (const ch of String(str)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function prng(seed) { let t = seed >>> 0; return () => { t += 0x6D2B79F5; let r = Math.imul(t ^ (t >>> 15), 1 | t); r ^= r + Math.imul(r ^ (r >>> 7), 61 | r); return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; }
function pct(sorted, p) { if (!sorted.length) return null; const i = Math.min(sorted.length - 1, Math.max(0, Math.ceil(p * sorted.length) - 1)); return sorted[i]; }
function uid(prefix) { return prefix + '_' + Math.random().toString(36).slice(2, 9); }
function deltaPts(d, invert = false) {
  if (d == null || isNaN(d)) return '<span class="flat">no earlier run</span>';
  const v = d * 100; if (Math.abs(v) < 0.05) return '<span class="flat">no change</span>';
  const good = invert ? v < 0 : v > 0;
  return `<span class="${good ? 'up' : 'down'}">${v > 0 ? '▲' : '▼'} ${Math.abs(v).toFixed(1)} pts</span>`;
}
function deltaMs(d) {
  if (d == null || isNaN(d)) return '<span class="flat">no earlier run</span>';
  if (Math.abs(d) < 1) return '<span class="flat">no change</span>';
  return `<span class="${d < 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${fmtMs(Math.abs(d))}</span>`;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400); }
const chip = v => `<span class="chip ${String(v).toLowerCase()}">${esc(v)}</span>`;
const fmtInt = v => v == null ? '–' : v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : v >= 1e4 ? Math.round(v / 1e3) + 'k' : v >= 1e3 ? (v / 1e3).toFixed(1) + 'k' : String(Math.round(v));
const fmtCost = v => v == null ? '–' : v >= 100 ? '$' + Math.round(v) : v >= 1 ? '$' + v.toFixed(2) : v >= 0.01 ? '$' + v.toFixed(3) : '$' + v.toFixed(4);
const fmtTime = ts => new Date(ts).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
function fmtAgo(ts, now = Date.now()) { const s = Math.max(0, (now - ts) / 1000); return s < 90 ? 'just now' : s < 5400 ? Math.round(s / 60) + ' min ago' : s < 129600 ? Math.round(s / 3600) + ' hours ago' : Math.round(s / 86400) + ' days ago'; }
function deltaRel(cur, prev) {
  if (!prev) return '<span class="flat">no earlier data</span>';
  const d = (cur - prev) / prev; if (Math.abs(d) < 0.005) return '<span class="flat">no change</span>';
  return `<span class="flat">${d > 0 ? '▲' : '▼'} ${Math.round(Math.abs(d) * 100)}%</span>`;
}

/* ---------------- Taxonomy ---------------- */
const CATEGORIES = [
  'Incorrect answer', 'Hallucination', 'Incomplete answer', 'Format violation', 'Instruction not followed',
  'Policy violation', 'Unwarranted refusal', 'Off-topic response', 'Latency SLA breach', 'Execution error'
];
const REVIEW_REASONS = ['Partial match', 'Awaiting human review', 'Awaiting AI judge'];
const REFUSAL_RE = /\b(can't|cannot|unable to|not able to|won't be able)\b/i;

/* ---------------- Evaluators ----------------
   Each check type: { label, category (default failure category), describe(check), run(output, check) -> {pass, partial?, manual?, detail} }
   To add an LLM-as-a-judge or custom evaluator later, register a new type here. */
const Evaluators = {
  contains_all: {
    label: 'Must include all', category: 'Incomplete answer',
    describe: c => c.values.map(v => `"${v}"`).join(', '),
    run(out, c) {
      const o = norm(out); const miss = c.values.filter(v => !o.includes(norm(v)));
      return { pass: !miss.length, partial: miss.length > 0 && miss.length < c.values.length, detail: miss.length ? `Missing ${miss.map(v => `"${v}"`).join(', ')}` : `Found all ${c.values.length} required term${c.values.length > 1 ? 's' : ''}` };
    }
  },
  contains_any: {
    label: 'Must include one of', category: 'Incorrect answer',
    describe: c => c.values.map(v => `"${v}"`).join(' or '),
    run(out, c) { const o = norm(out); const hit = c.values.find(v => o.includes(norm(v))); return { pass: !!hit, detail: hit ? `Found "${hit}"` : `None of ${c.values.map(v => `"${v}"`).join(', ')} found` }; }
  },
  not_contains: {
    label: 'Must not include', category: 'Hallucination',
    describe: c => c.values.map(v => `"${v}"`).join(', '),
    run(out, c) { const o = norm(out); const hit = c.values.filter(v => o.includes(norm(v))); return { pass: !hit.length, detail: hit.length ? `Found forbidden ${hit.map(v => `"${v}"`).join(', ')}` : 'No forbidden terms found' }; }
  },
  regex: {
    label: 'Matches pattern', category: 'Format violation',
    describe: c => `/${c.pattern}/${c.flags || ''}`,
    run(out, c) { let re; try { re = new RegExp(c.pattern, c.flags || ''); } catch (e) { return { pass: false, detail: 'The pattern is not a valid regular expression' }; } const ok = re.test(String(out)); return { pass: ok, detail: ok ? 'Output matches the pattern' : 'Output does not match the required pattern' }; }
  },
  json_keys: {
    label: 'Valid JSON with keys', category: 'Format violation',
    describe: c => c.keys.join(', '),
    run(out, c) {
      const s = String(out); const a = s.indexOf('{'), b = s.lastIndexOf('}');
      if (a < 0 || b < a) return { pass: false, detail: 'No JSON object found in the output' };
      let obj; try { obj = JSON.parse(s.slice(a, b + 1)); } catch (e) { return { pass: false, detail: 'Output contains braces but is not valid JSON' }; }
      const miss = c.keys.filter(k => !(k in obj)); const extra = s.slice(0, a).trim().length + s.slice(b + 1).trim().length;
      if (miss.length) return { pass: false, detail: `JSON is missing ${miss.join(', ')}` };
      if (c.strict && extra) return { pass: false, detail: 'JSON is wrapped in extra text' };
      return { pass: true, detail: `Valid JSON with ${c.keys.join(', ')}` };
    }
  },
  max_length: {
    label: 'Max length', category: 'Instruction not followed',
    describe: c => `${c.max} characters`,
    run(out, c) { const n = String(out).length; return { pass: n <= c.max, detail: `${n} characters against a limit of ${c.max}` }; }
  },
  human: {
    label: 'Human review', category: null, manual: true,
    describe: c => c.rubric,
    run(out, c) { return { pass: null, manual: true, detail: c.rubric }; }
  },
  // A model decides later, on the server (backend/app/judge.py); until then the result waits in Review.
  llm_judge: {
    label: 'AI judge', category: 'Instruction not followed',
    describe: c => c.criteria,
    run(out, c) { return { pass: null, pending: true, detail: 'Waiting for the AI judge' }; }
  }
};

function expectsRefusal(tc) { return (tc.checks || []).some(c => (c.values || []).some(v => REFUSAL_RE.test(v))); }

// live: production traffic. A request sent without checks is judged on errors and latency only, not sent to review.
function evaluate(tc, output, latencyMs, slaMs, error, live = false) {
  if (error) return { verdict: 'Fail', category: 'Execution error', reason: error, checks: [] };
  const refusalExpected = expectsRefusal(tc);
  const checks = (tc.checks || []).map(c => {
    const ev = Evaluators[c.type]; if (!ev) return { type: c.type, label: c.type, pass: false, detail: 'Unknown check type' };
    const r = { type: c.type, label: ev.label, spec: ev.describe(c), category: c.category || ev.category, ...ev.run(output, c) };
    if (c.fromCase) r.fromCase = c.fromCase; // a production request checked by the test case whose input it matches
    if (r.pending) r.refusalExpected = refusalExpected; // kept for deciding again once the judge has answered
    return r;
  });
  return decide(checks, output, latencyMs, slaMs, live, refusalExpected);
}
// The verdict for a list of check results (scoring rules in CLAUDE.md). Same as decide() in the backend.
function decide(checks, output, latencyMs, slaMs, live = false, refusalExpected = false) {
  const hard = checks.filter(r => !r.manual && r.pass === false && !r.partial);
  const partial = checks.filter(r => r.partial);
  const pending = checks.find(r => r.pending);
  const manual = checks.find(r => r.manual);
  const skipJudges = () => checks.forEach(r => { if (r.pending) { delete r.pending; r.skipped = true; r.detail = 'Not judged: the answer was already decided by the other checks'; } });
  if (!checks.length && !live) return { verdict: 'Review', category: 'Awaiting human review', reason: 'No automated checks are defined for this case.', checks };
  if (hard.length) {
    skipJudges();
    let cat = hard[0].category || 'Incorrect answer';
    if (REFUSAL_RE.test(output) && !refusalExpected && cat !== 'Policy violation') cat = 'Unwarranted refusal';
    return { verdict: 'Fail', category: cat, reason: `${hard[0].label} failed: ${hard[0].detail.replace(/\.+$/, '')}.`, checks };
  }
  if (partial.length) { skipJudges(); return { verdict: 'Review', category: 'Partial match', reason: `${partial[0].label} only partly met: ${partial[0].detail}.`, checks }; }
  if (pending) return { verdict: 'Review', category: 'Awaiting AI judge', reason: `Waiting for the AI judge to check: ${pending.spec}`, checks };
  if (manual) return { verdict: 'Review', category: 'Awaiting human review', reason: `Needs a reviewer to judge: ${manual.detail}`, checks };
  if (slaMs && latencyMs > slaMs) return { verdict: 'Fail', category: 'Latency SLA breach', reason: `Answer was correct but took ${fmtMs(latencyMs)} against a ${fmtMs(slaMs)} SLA.`, checks };
  if (!checks.length) return { verdict: 'Pass', category: null, reason: 'No errors and within the latency SLA. No content checks were sent.', checks };
  return { verdict: 'Pass', category: null, reason: 'All automated checks passed.', checks };
}

/* ---------------- Telemetry (spans) ---------------- */
// Tokens and cost of one execution, summed from span attributes set on each model call. Same as span_totals() in the backend.
function spanTotals(spans) {
  const t = { tokensIn: null, tokensOut: null, costUsd: null };
  const keys = { tokensIn: ['prompt_tokens', 'input_tokens'], tokensOut: ['completion_tokens', 'output_tokens'], costUsd: ['cost_usd'] };
  (spans || []).forEach(sp => { const a = sp.attrs || {}; Object.entries(keys).forEach(([f, ks]) => ks.forEach(k => { const v = a[k]; if (typeof v === 'number' && isFinite(v) && v >= 0) t[f] = (t[f] || 0) + v; })); });
  if (t.tokensIn != null) t.tokensIn = Math.trunc(t.tokensIn); if (t.tokensOut != null) t.tokensOut = Math.trunc(t.tokensOut);
  return t;
}
function buildSpans(suite, total, rand, meta) {
  const spans = [{ name: 'request', kind: 'root', start: 0, dur: total, depth: 0, attrs: { suite: suite.name, case: meta.caseId } }];
  let t = 0;
  const pb = Math.round(4 + rand() * 14);
  spans.push({ name: 'prompt.build', kind: 'other', start: t, dur: pb, depth: 1, attrs: { template: meta.version } }); t += pb;
  const post = Math.round(3 + rand() * 6);
  const llmAttrs = { model: meta.model, temperature: 0.2 };
  if (suite.pipeline === 'rag') {
    const d = Math.round(total * (0.16 + rand() * 0.12));
    spans.push({ name: 'retrieval.search', kind: 'retrieval', start: t, dur: d, depth: 1, attrs: { index: 'catalog-v3', top_k: 5, docs_returned: 3 + Math.floor(rand() * 3) } }); t += d;
    spans.push({ name: 'llm.generate', kind: 'llm', start: t, dur: Math.max(10, total - t - post), depth: 1, attrs: llmAttrs }); t = total - post;
  } else if (suite.pipeline === 'tools') {
    const plan = Math.round(total * (0.22 + rand() * 0.1));
    spans.push({ name: 'llm.plan', kind: 'llm', start: t, dur: plan, depth: 1, attrs: { ...llmAttrs, decision: 'call tool' } }); t += plan;
    const tool = Math.round(total * (0.18 + rand() * 0.14));
    spans.push({ name: 'tool.get_order_status', kind: 'tool', start: t, dur: tool, depth: 1, attrs: { status: 200, source: 'order-service' } }); t += tool;
    spans.push({ name: 'llm.generate', kind: 'llm', start: t, dur: Math.max(10, total - t - post), depth: 1, attrs: llmAttrs }); t = total - post;
  } else {
    spans.push({ name: 'llm.generate', kind: 'llm', start: t, dur: Math.max(10, total - t - post), depth: 1, attrs: llmAttrs }); t = total - post;
  }
  spans.push({ name: 'response.postprocess', kind: 'other', start: t, dur: post, depth: 1, attrs: {} });
  return spans;
}

/* ---------------- Targets (systems under test) ----------------
   Each target: { id, label, invoke(suite, tc, cfg, rand) -> {output, latencyMs, spans, error?} } */
const Targets = {
  simulated: {
    id: 'simulated', label: 'Simulated build',
    async invoke(suite, tc, cfg, rand) {
      const sim = tc.sim || synthSim(tc);
      let kind = cfg.overrides && cfg.overrides[tc.id];
      if (!kind) {
        const p = (cfg.quality ?? 0.85) - (tc.hard || 0);
        kind = rand() < p ? 'good' : (sim.partial && rand() < 0.45 ? 'partial' : 'bad');
      }
      let output = sim.good;
      if (kind === 'partial' && sim.partial) output = sim.partial;
      else if (kind === 'bad' && sim.bad && sim.bad.length) output = sim.bad[Math.floor(rand() * sim.bad.length)];
      let lat = (suite.baseMs || 1200) * (cfg.latencyFactor || 1) * (0.55 + rand() * 0.9);
      if (rand() < 0.05) lat *= 2.4;
      lat = Math.round(lat);
      return { output, latencyMs: lat, spans: buildSpans(suite, lat, rand, { caseId: tc.id, model: cfg.model, version: cfg.version }) };
    }
  },
  recorded: {
    id: 'recorded', label: 'Recorded outputs',
    async invoke(suite, tc, cfg, rand) {
      if (tc.recorded == null) return { output: '', latencyMs: 0, spans: [], error: 'No recorded output was uploaded for this case.' };
      const lat = tc.recordedLatencyMs || 0;
      return { output: tc.recorded, latencyMs: lat, spans: lat ? [{ name: 'recorded.response', kind: 'root', start: 0, dur: lat, depth: 0, attrs: { source: 'upload' } }] : [] };
    }
  },
  live: {
    id: 'live', label: 'Claude (live)',
    async invoke(suite, tc, cfg) {
      const sample = await Live.get();
      if (!sample) return { output: '', latencyMs: 0, spans: [], error: 'Live model calls are not available in this view.' };
      const prompt = `<instructions>\n${suite.systemPrompt || 'You are a helpful assistant.'}\n</instructions>\n${suite.context ? `<reference>\n${suite.context}\n</reference>\n` : ''}\nReply to the user message below as the assistant would, with only the reply text.\n\n<user_message>\n${tc.input}\n</user_message>`;
      const t0 = performance.now();
      try {
        const res = await sample(prompt, { modelTier: 'quick', cache: false, signal: cfg.signal });
        const lat = Math.round(performance.now() - t0);
        return { output: res.text.trim(), latencyMs: lat, spans: [
          { name: 'request', kind: 'root', start: 0, dur: lat, depth: 0, attrs: { suite: suite.name, case: tc.id } },
          { name: 'prompt.build', kind: 'other', start: 0, dur: 1, depth: 1, attrs: { chars: prompt.length } },
          { name: 'llm.generate', kind: 'llm', start: 1, dur: Math.max(1, lat - 1), depth: 1, attrs: { model: 'claude (quick tier)', truncated: !!res.truncated } }
        ] };
      } catch (e) {
        const lat = Math.round(performance.now() - t0);
        return { output: e && e.text || '', latencyMs: lat, spans: [], error: `Model call failed (${e && e.code || 'error'}): ${e && e.message || 'unknown error'}`, code: e && e.code };
      }
    }
  }
};
const Live = {
  _p: null,
  get() { if (!this._p) this._p = (window.claude && window.claude.use) ? window.claude.use('sample').catch(() => null) : Promise.resolve(null); return this._p; }
};

function synthSim(tc) {
  const parts = [];
  (tc.checks || []).forEach(c => { if (c.type === 'contains_all') parts.push(...c.values); if (c.type === 'contains_any') parts.push(c.values[0]); });
  return { good: (tc.expected || 'OK') + (parts.length ? ' ' + parts.join(' ') : ''), bad: ["I'm not sure about that. Could you rephrase your question?"] };
}

/* ---------------- Run execution ---------------- */
async function executeRun(suite, cfg, onProgress) {
  const target = Targets[cfg.target];
  const runSeed = hash(cfg.runId + (cfg.seedSalt || ''));
  const run = {
    id: cfg.runId, suiteId: suite.id, version: cfg.version, model: cfg.model, target: cfg.target, note: cfg.note || '',
    startedAt: cfg.startedAt || Date.now(), finishedAt: null, slaMs: suite.slaMs, results: []
  };
  let clock = run.startedAt;
  for (let i = 0; i < suite.cases.length; i++) {
    if (cfg.signal && cfg.signal.aborted) break;
    const tc = suite.cases[i];
    const rand = prng(runSeed ^ hash(tc.id));
    const res = await target.invoke(suite, tc, cfg, rand);
    const ev = evaluate(tc, res.output, res.latencyMs, suite.slaMs, res.error);
    clock += res.latencyMs + (cfg.live ? 0 : Math.round(200 + rand() * 600));
    const row = {
      caseId: tc.id, input: tc.input, expected: tc.expected, actual: res.output,
      verdict: ev.verdict, category: ev.category, reason: ev.reason, checks: ev.checks,
      latencyMs: res.latencyMs, timestamp: cfg.live ? Date.now() : clock, model: cfg.model, version: cfg.version, spans: res.spans
    };
    run.results.push(row);
    if (onProgress) await onProgress(row, i, suite.cases.length);
    if (res.code === 'not_granted' || res.code === 'rate_limited') break;
  }
  run.finishedAt = cfg.live ? Date.now() : clock;
  return run;
}

/* ---------------- Analytics ---------------- */
function summarize(results) {
  const n = results.length; const c = { Pass: 0, Fail: 0, Review: 0 }; const cats = {}; const reviews = {};

    { n: 7, version: 'v1.4', model: 'gpt-4o-mini', since: '2026-09-23T13:30:00+05:30', cut: 0.45, scary: 0.3, error: 0.008, speed: 0.75, price: [0.15, 0.6] }
  ]
};
// New conversations per hour, by hour of day in India time, where most of the demo app's users are.
const LIVE_SESSIONS_PER_HOUR = [0.1, 0.05, 0.05, 0, 0, 0.05, 0.15, 0.3, 0.45, 0.55, 0.6, 0.65, 0.7, 0.65, 0.6, 0.6, 0.65, 0.75, 0.9, 1, 0.95, 0.75, 0.45, 0.25];
// Same as limit_words() in the example story generator app.
const limitWords = (text, n = 80) => { const w = text.split(/\s+/).filter(Boolean); return w.length <= n ? text.trim() : w.slice(0, n).join(' ').replace(/[,;:]+$/, '') + '…'; };
function buildLiveRuns(suite) {
  const rand = prng(hash('live:' + suite.id)); const IST = 5.5 * HOUR_MS;
  const t0 = new Date(LIVE_SEED.from).getTime(), t1 = new Date(LIVE_SEED.to).getTime();
  const [o0, o1] = LIVE_SEED.outage.map(d => new Date(d).getTime());
  const users = Array.from({ length: 48 }, (_, i) => 'u_' + (1000 + (i * 7919) % 9000));
  const requests = [];
  for (let h = t0; h < t1; h += HOUR_MS) {
    const local = new Date(h + IST); const weekend = [0, 6].includes(local.getUTCDay());
    const rate = LIVE_SESSIONS_PER_HOUR[local.getUTCHours()] * (weekend ? 1.3 : 1);
    const sessions = Math.floor(rate) + (rand() < rate % 1 ? 1 : 0);
    for (let j = 0; j < sessions; j++) {
      const user = users[Math.min(users.length - 1, Math.floor(Math.pow(rand(), 1.8) * users.length))];
      const sessionId = 'sess_' + hash(`${user}:${h}:${j}`).toString(36); const client = ['web', 'web', 'web', 'ios', 'android'][Math.floor(rand() * 5)];
      const n = rand() < 0.45 ? 1 : rand() < 0.55 ? 2 : rand() < 0.6 ? 3 : 4;
      let ts = h + Math.floor(rand() * HOUR_MS);
      for (let m = 0; m < n && ts < t1; m++) {
        const req = { ts, user, sessionId, client, p: LIVE_PROMPTS[Math.floor(rand() * LIVE_PROMPTS.length)] }; requests.push(req);
        if (ts >= o0 && ts < o1) requests.push({ ...req, ts: ts + 50000 }, { ...req, ts: ts + 110000 }); // people press "try again" during the outage
        ts += 60000 + Math.floor(rand() * 5 * 60000);
      }
    }
  }
  const extra = prng(hash('no-story:' + suite.id)); // a separate stream, so the rest of the traffic stays the same
  for (let k = 0; k < 12; k++) {
    const ts = t0 + 7 * DAY_MS + Math.floor(extra() * (t1 - t0 - 7 * DAY_MS)); const user = users[Math.floor(extra() * users.length)];
    requests.push({ ts, user, sessionId: 'sess_' + hash(`${user}:${ts}`).toString(36), client: 'web', p: NO_STORY });
  }
  requests.sort((a, b) => a.ts - b.ts);
  const results = requests.map((q, i) => {
    const rand = prng(hash(`live:${q.sessionId}:${q.ts}`)); // each request's outcome is its own draw
    const v = LIVE_SEED.versions.filter(x => !x.since || q.ts >= new Date(x.since).getTime()).pop();
    const input = q.p.genre === 'any' ? q.p.prompt : `${q.p.prompt} (genre: ${q.p.genre})`;
    const outage = q.ts >= o0 && q.ts < o1;
    let error = null, raw = q.p.good;
    if (rand() < (outage ? 0.75 : v.error)) error = outage ? 'StoryError: Could not reach OpenAI. Check your connection.' : 'StoryError: The server had an error while processing your request.';
    else if (q.p.long && rand() < v.cut) raw = q.p.long;
    else if (q.p.scary && rand() < v.scary) raw = q.p.scary;
    const actual = error ? '' : limitWords(raw); const truncated = !error && actual !== raw.trim();
    const wordsIn = raw.split(/\s+/).length, wordsOut = actual.split(/\s+/).filter(Boolean).length;
    const pt = 62 + Math.round(input.split(/\s+/).length * 1.3), ct = truncated ? 140 : Math.round(wordsIn * 1.35 + rand() * 6);
    const cost = Math.round((pt * v.price[0] + ct * v.price[1]) / 1e6 * 1e8) / 1e8;
    let llm = error ? (outage ? 1800 + rand() * 1400 : 500 + rand() * 500) : (650 + ct * 12.5) * v.speed * (0.8 + rand() * 0.5) * (rand() < 0.03 ? 2.6 : 1);
    llm = Math.round(llm); const pb = 2 + Math.floor(rand() * 5), post = error ? 0 : 1 + Math.floor(rand() * 3), total = pb + llm + post;
    const callAttrs = error ? { model: v.model, max_tokens: 140, error } : { model: v.model, max_tokens: 140, prompt_tokens: pt, completion_tokens: ct, finish_reason: truncated ? 'length' : 'stop', cost_usd: cost };
    const spans = [
      { name: 'request', kind: 'root', start: 0, dur: total, depth: 0, attrs: { suite: suite.name } },
      { name: 'prompt.build', kind: 'other', start: 0, dur: pb, depth: 1, attrs: {} },
      { name: 'llm.generate', kind: 'llm', start: pb, dur: llm, depth: 1, attrs: error ? { error } : {} },
      { name: 'openai.chat.completions', kind: 'llm', start: pb + 1, dur: llm - 2, depth: 2, attrs: callAttrs },
      ...(error ? [] : [{ name: 'response.postprocess', kind: 'other', start: pb + llm, dur: post, depth: 1, attrs: {} },
        { name: 'word_limit', kind: 'other', start: pb + llm, dur: 0, depth: 2, attrs: { words_before: wordsIn, words_after: wordsOut, truncated } }])
    ];
    const judged = prng(hash(`judge:${q.sessionId}:${q.ts}`))() * 100 < LIVE_JUDGE.sample;
    const checks = [...LIVE_STORY_CHECKS, ...(q.p.genre === 'bedtime' ? [BEDTIME_CHECK] : []), ...(judged ? [LIVE_JUDGE] : [])];
    let ev = evaluate({ checks }, actual, total, suite.slaMs, error, true);
    if (ev.category === 'Awaiting AI judge') { // what the judge (backend/app/judge.py) records once the model answers
      const j = ev.checks.find(c => c.pending); const refusal = j.refusalExpected; delete j.pending; delete j.refusalExpected;
      Object.assign(j, q.p.noStory ? { pass: false, detail: 'The person asked not to get a story, and got one.' } : { pass: true, detail: LIVE_JUDGE_PASS[i % LIVE_JUDGE_PASS.length] }, { judgedBy: 'gpt-4o-mini' });
      ev = decide(ev.checks, actual, total, suite.slaMs, true, refusal);
    }
    return { caseId: 'LIVE-' + String(i + 1).padStart(5, '0'), input, expected: '', actual, verdict: ev.verdict, category: ev.category, reason: ev.reason, checks: ev.checks,
      latencyMs: total, timestamp: q.ts, model: v.model, version: v.version, spans, userId: q.user, sessionId: q.sessionId, tags: [q.p.genre], metadata: { client: q.client }, ...spanTotals(spans) };
  });
  return LIVE_SEED.versions.map(v => {
    const rs = results.filter(r => r.version === v.version); const last = rs[rs.length - 1];
    return { id: `${suite.prefix}-R${v.n}`, suiteId: suite.id, version: v.version, model: v.model, target: 'production', note: 'Live traffic', startedAt: rs[0].timestamp, finishedAt: last.timestamp + last.latencyMs, slaMs: suite.slaMs, results: rs };
  });
}

/* Demo reviews: Priya reviewed the cases that need a person in the first three runs, and Sam spot-checked about half
   of the production requests picked for it. Later runs are still waiting in the review queue. */
const SEED_REVIEW_NOTES = {
  'DS-009': { pass: 'Clear beginning, turn and ending. Reads naturally.', fail: ['Incomplete answer', 'Three flat sentences: no turn and no ending.'] },
  'DS-010': { pass: 'Both friends are named and the story is complete.', fail: ['Incomplete answer', 'Dev is only "her friend"; he is never named.'] }
};
const SEED_SPOT_NOTES = ['Reads well and fits the prompt.', 'Good story, right length.', 'Fine. Keeps to the genre.', 'On topic and complete.'];
function applySeedReviews(runs) {
  const at = (ts, hours) => ts + hours * HOUR_MS;
  runs.filter(r => ['DS-R1', 'DS-R2', 'DS-R3'].includes(r.id)).forEach(r => r.results.filter(x => x.verdict === 'Review').forEach(x => {
    const n = SEED_REVIEW_NOTES[x.caseId]; if (!n) return;
    const good = x.actual === storySim(x.caseId).good;
    applyReview(x, good ? { verdict: 'Pass', note: n.pass, reviewer: 'Priya' } : { verdict: 'Fail', category: n.fail[0], note: n.fail[1], reviewer: 'Priya' }, at(r.startedAt, 20));
  }));
  const spots = runs.filter(isLive).flatMap(r => r.results).filter(x => x.verdict === 'Pass' && isSpotCheck(x.caseId));
  const end = new Date(LIVE_SEED.to).getTime(); // never after the demo's last request
  spots.filter((x, i) => i % 2 === 0).forEach((x, i) => applyReview(x, { verdict: 'Pass', note: SEED_SPOT_NOTES[i % SEED_SPOT_NOTES.length], reviewer: 'Sam' }, Math.min(at(x.timestamp, 18), end)));
}

async function buildSeed() {
  const suites = SEED_SUITES.map(s => ({
    id: s.id, prefix: s.prefix, name: s.name, description: s.description, pipeline: s.pipeline, slaMs: s.slaMs, baseMs: s.baseMs,
    systemPrompt: s.systemPrompt, context: s.context, createdAt: new Date(s.runs[0].date).getTime() - 86400000 * 3, ...(s.id === LIVE_SEED.suiteId ? { liveChecks: [LIVE_JUDGE] } : {}),
    cases: s.cases.map(c => ({ ...c }))
  }));
  const runs = [];
  for (const s of SEED_SUITES) {
    const suite = suites.find(x => x.id === s.id);
    for (const r of s.runs) {
      runs.push(await executeRun(suite, { runId: `${s.prefix}-R${r.n}`, target: 'simulated', version: r.version, model: r.model, note: r.note, quality: r.quality, latencyFactor: r.latencyFactor, overrides: r.overrides, startedAt: new Date(r.date).getTime() }));
    }
    if (s.id === LIVE_SEED.suiteId) runs.push(...buildLiveRuns(suite));
  }
  applySeedReviews(runs);

}

/* ---------------- Charts ---------------- */
function lineChart(series, opts = {}) {
  const W = 640, H = opts.h || 220, pl = 46, pr = 14, pt = opts.markers && opts.markers.length ? 26 : 12, pb = 28;
  series = series.map(s => ({ ...s, points: s.points.filter(p => p.y != null && !isNaN(p.y)) })); // gaps, such as an hour with no requests
  const pts = series.flatMap(s => s.points);
  if (!pts.length) return `<p class="muted">${esc(opts.empty || 'No runs yet.')}</p>`;
  let xmin = Math.min(...pts.map(p => p.x)), xmax = Math.max(...pts.map(p => p.x));
  if (opts.xMin != null) xmin = Math.min(xmin, opts.xMin);
  if (opts.xMax != null) xmax = Math.max(xmax, opts.xMax);
  if (xmin === xmax) { xmin -= 86400000; xmax += 86400000; }
  let ymin = opts.yMin ?? 0, ymax = opts.yMax ?? (Math.max(...pts.map(p => p.y)) * 1.15 || 1);
  const X = x => pl + (x - xmin) / (xmax - xmin) * (W - pl - pr);
  const Y = y => pt + (1 - (y - ymin) / (ymax - ymin)) * (H - pt - pb);
  const yf = opts.yFmt || (v => v);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = ymin + (ymax - ymin) * i / 4; const y = Y(v); g += `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/><text x="${pl - 8}" y="${y + 4}" text-anchor="end">${esc(yf(v))}</text>`; }
  const xf = opts.xFmt || fmtDate;
  for (let i = 0; i <= 4; i++) { const x = xmin + (xmax - xmin) * i / 4; g += `<text x="${X(x)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === 4 ? 'end' : 'middle'}">${esc(xf(x))}</text>`; }
  // Markers: vertical lines for events such as a deploy.
  (opts.markers || []).filter(m => m.x >= xmin && m.x <= xmax).forEach(m => { const x = X(m.x); const right = x > W - 120;
    g += `<line x1="${x}" x2="${x}" y1="${pt - 14}" y2="${H - pb}" stroke="var(--ink-3)" stroke-dasharray="3 3" stroke-width="1"/><text x="${right ? x - 4 : x + 4}" y="${pt - 16}" text-anchor="${right ? 'end' : 'start'}" style="fill:var(--ink-2);font-weight:600">${esc(m.label)}</text>`; });
  if (opts.threshold != null) { const y = Y(opts.threshold); g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--fail)" stroke-dasharray="4 4" stroke-width="1"/><text x="${W - pr}" y="${y - 5}" text-anchor="end" style="fill:var(--fail)">${esc(opts.thresholdLabel || '')}</text>`; }
  const lines = series.map(s => {
    const sp = s.points.slice().sort((a, b) => a.x - b.x);
    const d = sp.map((p, i) => `${i ? 'L' : 'M'}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
    const dots = sp.map(p => `<a href="${esc(p.href || '#')}"><circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5" fill="var(--surface)" stroke="${s.color}" stroke-width="2"><title>${esc(p.title || '')}</title></circle></a>`).join('');
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>${dots}`;
  }).join('');
  const legend = series.length > 1 || opts.legend ? `<div class="series-legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'Chart')}">${g}${lines}</svg>${legend}</div>`;
}
function catBars(cats, hrefFor) {
  const rows = sortedCats(cats); if (!rows.length) return '<p class="muted">No failures in these runs.</p>';
  const max = rows[0][1];
  return `<div class="bars">${rows.map(([k, v]) => `<div class="bar-row"><a href="${esc(hrefFor(k))}">${esc(k)}</a><div class="bar-track"><div class="bar-fill" style="width:${(v / max * 100).toFixed(1)}%"></div></div><span class="n">${v}</span></div>`).join('')}</div>`;

  </section>`;

  const metric = q.metric === 'latency' ? 'latency' : 'pass';
  const series = per.map(x => ({ name: x.suite.name, color: suiteColor(x.suite.id), points: x.runs.map(r => { const s = runSummary(r); return { x: r.startedAt, y: metric === 'latency' ? s.p95 : s.passRate, href: `#/results/${r.id}`, title: `${x.suite.name} ${r.version} (${r.model}): ${metric === 'latency' ? fmtMs(s.p95) + ' p95' : fmtPct(s.passRate)}` }; }) }));
  const chart = metric === 'latency'
    ? lineChart(series, { yMin: 0, yFmt: v => fmtMs(v), label: 'p95 latency by run' })
    : lineChart(series, { yMin: 0, yMax: 1, yFmt: v => fmtPct0(v), label: 'Pass rate by run' });

  const trendPanel = `<div class="panel"><div class="panel-head"><div><h2>Trend across runs</h2><p class="hint">Each point is one run. Select a point to open it.</p></div>
    <div class="tabs" role="tablist"><a role="tab" class="${metric === 'pass' ? 'on' : ''}" href="#/dashboard${qs({ suite: q.suite })}">Pass rate</a><a role="tab" class="${metric === 'latency' ? 'on' : ''}" href="#/dashboard${qs({ metric: 'latency', suite: q.suite })}">p95 latency</a></div></div>${chart}</div>`;
  const catPanel = `<div class="panel"><h2>Failure categories</h2><p class="hint">Failed cases in the latest run of each suite, by root cause.</p>${catBars(cur.cats, k => '#/cases' + qs({ cat: k, v: 'Fail' }))}
    ${waitingNote(cur.reviews, 'waiting in review', { source: 'runs' })}</div>`;

  const table = `<div class="panel"><h2>Suite health</h2><p class="hint">Latest run of each suite compared with the run before it.</p><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Suite</th><th>Latest</th><th class="num">Pass rate</th><th class="num">Change</th><th>Pass / fail / review</th><th class="num">p95</th><th class="num">Regressions</th><th class="num">Fixed</th></tr></thead><tbody>
    ${per.map(x => `<tr data-href="#/suites/${esc(x.suite.id)}"><td><a href="#/suites/${esc(x.suite.id)}"><b>${esc(x.suite.name)}</b></a><div class="muted" style="font-size:12.5px">${pipelineLabel(x.suite.pipeline)}</div></td>
      <td class="nowrap">${esc(x.cur.version)} <span class="muted">${esc(x.cur.model)}</span><div class="muted" style="font-size:12.5px">${fmtDate(x.cur.startedAt)}</div></td>
      <td class="num"><b>${fmtPct(x.sum.passRate)}</b></td><td class="num">${x.prev ? deltaPts(x.sum.passRate - runSummary(x.prev).passRate) : '–'}</td>
      <td style="min-width:150px">${pfrBar(x.sum)}</td><td class="num">${fmtMs(x.sum.p95)}</td>
      <td class="num">${x.cmp ? (x.cmp.regressions.length ? `<a class="down" href="#/compare${qs({ suite: x.suite.id, a: x.prev.id, b: x.cur.id })}"><b>${x.cmp.regressions.length}</b></a>` : '0') : '–'}</td>
      <td class="num">${x.cmp ? (x.cmp.fixes.length ? `<span class="up">${x.cmp.fixes.length}</span>` : '0') : '–'}</td></tr>`).join('')}
  </tbody></table></div></div>`;

  const mSuite = getSuite(q.suite) || worst.suite;
  const matrix = `<div class="panel"><div class="panel-head"><div><h2>Test case history</h2><p class="hint">Every test case across every run. Outlined cells passed in the run before and fail now.</p></div>
    <div class="tabs">${per.map(x => `<a class="${x.suite.id === mSuite.id ? 'on' : ''}" href="#/dashboard${qs({ suite: x.suite.id, metric: q.metric })}">${esc(x.suite.name)}</a>`).join('')}</div></div>
    ${matrixView(mSuite)}</div>`;

  return head('Quality overview', 'Based on the latest run of each suite.', `<a class="btn" href="#/compare">Compare runs</a><a class="btn primary" href="#/run">Run evaluation</a>`) + kpis + dashboardLive() + `<div class="grid2">${trendPanel}${catPanel}</div>` + `<div style="margin-top:18px">${matrix}</div><div style="margin-top:18px">${table}</div>`;
}
function matrixView(suite) {
  const rs = runsFor(suite.id);
  if (!rs.length) return '<p class="muted">This suite has not been run yet.</p>';
  const cols = rs.length;
  let html = `<div class="matrix-wrap"><div class="matrix" style="grid-template-columns:auto repeat(${cols}, minmax(56px,1fr))"><div></div>`;
  rs.forEach(r => { const s = runSummary(r); html += `<a class="ch" href="#/results/${esc(r.id)}"><b>${esc(r.version)}</b>${fmtPct0(s.passRate)}</a>`; });
  suite.cases.forEach(tc => {
    html += `<a class="rh" href="${caseHref(suite.id, tc.id)}">${esc(tc.id)}<span>${esc(tc.input)}</span></a>`;
    rs.forEach((r, i) => {
      const x = r.results.find(y => y.caseId === tc.id);
      if (!x) { html += '<span class="cell" title="Not run"></span>'; return; }
      const p = i > 0 ? rs[i - 1].results.find(y => y.caseId === tc.id) : null;
      const reg = p && p.verdict === 'Pass' && x.verdict === 'Fail';
      html += `<a class="cell ${x.verdict.toLowerCase()} ${reg ? 'regress' : ''}" href="${traceHref(r.id, tc.id)}" title="${esc(`${tc.id} in ${r.version}: ${x.verdict}${x.category ? ' (' + x.category + ')' : ''}`)}" aria-label="${esc(`${tc.id} in ${r.version}: ${x.verdict}`)}"></a>`;
    });
  });
  html += `</div></div><div class="legend"><span><i style="background:var(--pass-soft);box-shadow:inset 0 0 0 1px var(--pass)"></i>Pass</span><span><i style="background:var(--fail)"></i>Fail</span><span><i style="background:var(--review-soft);box-shadow:inset 0 0 0 1px var(--review)"></i>Review</span><span><i style="border:2px solid var(--fail);background:transparent"></i>Regression</span></div>`;
  return html;
}

/* Run evaluation */
const RunState = { active: null, log: [], suiteId: null, total: 0, done: false, runId: null, controller: null, error: null };
function nextVersion(v) { const m = /^(v?)(\d+)\.(\d+)(.*)$/.exec(v || ''); return m ? `${m[1]}${m[2]}.${+m[3] + 1}` : 'v1.0'; }

      <label class="field full"><span>What changed in this version</span><input type="text" id="run-note" placeholder="For example: tightened JSON instructions"></label>

    </div></details>
    <div class="split" style="margin-top:18px"><span class="note">${l ? `Last run: ${esc(l.version)} on ${esc(l.model)}, ${fmtDate(l.startedAt)}, ${fmtPct(runSummary(l).passRate)} pass rate.` : 'This suite has not been run yet.'}</span>

    ${api ? `<label class="field" style="margin-bottom:12px"><span>Suite</span><select id="run-suite">${S.suites.map(x => `<option value="${esc(x.id)}" ${x.id === s.id ? 'selected' : ''}>${esc(x.name)} (${x.cases.length} cases)</option>`).join('')}</select></label>` : ''}

  const simNote = `<div class="panel"><h2>Simulated runs</h2><p class="hint">Simulated, recorded and live-model runs are part of demo data mode. In live data mode, runs come from your code. After one finishes, refresh to see it.</p><div class="actions"><button class="btn primary" data-action="refresh-data">Refresh data</button><a class="btn" href="#/results">Open results</a></div></div>`;

function runProgressHtml() {
  if (!RunState.active) return '';
  const s = getSuite(RunState.suiteId); const n = RunState.log.length; const t = RunState.total;
  const sum = summarize(RunState.log);
  const rows = RunState.log.map(r => `<tr ${RunState.done && RunState.runId ? `data-href="${traceHref(RunState.runId, r.caseId)}"` : ''}><td class="mono">${esc(r.caseId)}</td><td>${chip(r.verdict)}</td><td class="nowrap">${esc(r.category || '')}</td><td class="num">${fmtMs(r.latencyMs)}</td><td><div class="clip ink2">${esc(r.actual)}</div></td></tr>`).join('');
  return `<div class="panel" style="margin-top:18px"><div class="split"><div><h2>${RunState.done ? 'Run complete' : 'Running'}: ${esc(s ? s.name : '')} ${esc(RunState.version || '')}</h2><p class="hint" style="margin:0">${n} of ${t} test cases${n ? ` · ${fmtPct(sum.passRate)} passing so far` : ''}</p></div>
    <div class="actions">${RunState.done ? (RunState.runId ? `<a class="btn" href="#/compare${qs({ suite: RunState.suiteId, b: RunState.runId })}">Compare with previous</a><a class="btn primary" href="#/results/${esc(RunState.runId)}">Open results</a>` : '') : `<button class="btn" data-action="stop-run">Stop</button>`}</div></div>
    <div class="progress"><div style="width:${t ? n / t * 100 : 0}%"></div></div>${RunState.error ? `<p class="err">${esc(RunState.error)}</p>` : ''}
    ${n ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Case</th><th>Result</th><th>Failure reason</th><th class="num">Latency</th><th>Actual output</th></tr></thead><tbody>${rows}</tbody></table></div>` : ''}</div>`;
}
async function startRun() {
  const s = getSuite($('#run-suite').value); if (!s) return;
  if (!s.cases.length) { toast('Add test cases to this suite first'); return; }
  const target = ($('input[name=target]:checked') || {}).value || 'simulated';
  const version = $('#run-version').value.trim() || 'v?';
  const model = $('#run-model').value.trim() || 'unknown';
  const note = $('#run-note').value.trim();
  const quality = Math.min(1, Math.max(0.3, parseFloat($('#sim-quality').value) || 0.9));
  const latencyFactor = Math.min(3, Math.max(0.3, parseFloat($('#sim-latency').value) || 1));
  const n = Store.state.runs.filter(r => r.suiteId === s.id).length + 1;
  const runId = `${s.prefix || 'RN'}-R${n}` + (getRun(`${s.prefix || 'RN'}-R${n}`) ? '-' + Math.random().toString(36).slice(2, 5) : '');
  const controller = new AbortController();
  Object.assign(RunState, { active: true, log: [], suiteId: s.id, total: s.cases.length, done: false, runId: null, controller, error: null, version });
  refreshRunProgress();
  const live = target === 'live';
  const run = await executeRun(s, { runId, target, version, model: live ? 'claude (quick tier)' : model, note, quality, latencyFactor, signal: controller.signal, live: live || target === 'recorded', seedSalt: String(Date.now()), startedAt: Date.now() }, async (row) => {
    RunState.log.push(row);
    if (row.category === 'Execution error' && /not_granted|rate_limited/.test(row.reason)) RunState.error = row.reason;
    refreshRunProgress();
    if (target === 'simulated') await sleep(Math.min(420, 90 + row.latencyMs / 8));
  });
  if (target === 'recorded' || target === 'simulated') { run.startedAt = Date.now() - (run.finishedAt - run.startedAt); }
  if (run.results.length) {
    Store.state.runs.push(run); Store.save();
    RunState.runId = run.id;
    if (controller.signal.aborted) RunState.error = `Stopped after ${run.results.length} of ${s.cases.length} cases. The partial run was saved.`;
  }
  RunState.done = true; refreshRunProgress();
  const btn = $('[data-action=start-run]'); if (btn) btn.disabled = false;
  toast(run.results.length ? `Run ${run.id} saved` : 'Run stopped before any case finished');
}
function refreshRunProgress() { const el = $('#run-progress'); if (el) el.innerHTML = runProgressHtml(); const b = $('[data-action=start-run]'); if (b) b.disabled = RunState.active && !RunState.done; }
async function setupLiveOption() {
  const card = $('#live-card'); if (!card) return;
  const sample = await Live.get();
  const c = $('#live-card'); if (!c) return;
  const input = c.querySelector('input'); const note = $('#live-note');
  if (sample) { input.disabled = false; note.textContent = 'Sends each test case to Claude with the suite\'s prompt and reference data, and measures real latency. Uses your Claude usage.'; }
  else note.textContent = 'Live model calls aren\'t available in this view. Open the published page in Claude to use them.';
}

/* Test cases */
function allCaseRows() {
  return Store.state.suites.flatMap(s => { const l = latestRun(s.id); return s.cases.map(tc => ({ s, tc, x: l ? l.results.find(y => y.caseId === tc.id) : null, run: l })); });
}
function pageCases(q) {
  const rows = allCaseRows();
  const text = (q.q || '').toLowerCase();
  const filtered = rows.filter(r => (!q.suite || r.s.id === q.suite) && (!q.v || (r.x && r.x.verdict === q.v)) && (!q.cat || (r.x && r.x.category === q.cat)) && (!text || (r.tc.id + ' ' + r.tc.input + ' ' + r.tc.expected + ' ' + (r.tc.tag || '')).toLowerCase().includes(text)));
  const cats = [...new Set(rows.map(r => r.x && r.x.category).filter(Boolean))].sort();
  const filters = `<div class="filters" data-filter-page="cases">
    <label class="field" style="width:220px"><span>Suite</span><select data-filter="suite"><option value="">All suites</option>${Store.state.suites.map(s => `<option value="${esc(s.id)}" ${q.suite === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>
    <label class="field" style="width:150px"><span>Latest result</span><select data-filter="v"><option value="">Any</option>${['Pass', 'Fail', 'Review'].map(v => `<option ${q.v === v ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    <label class="field" style="width:210px"><span>Failure reason</span><select data-filter="cat"><option value="">Any</option>${cats.map(c => `<option ${q.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
    <label class="field" style="flex:1;min-width:180px"><span>Search</span><input type="search" data-filter="q" value="${esc(q.q || '')}" placeholder="ID, input, expected behaviour or tag"></label>
    ${q.suite || q.v || q.cat || q.q ? '<a class="btn sm" href="#/cases" style="margin-bottom:4px">Clear filters</a>' : ''}</div>`;
  const body = filtered.map(r => `<tr data-href="${caseHref(r.s.id, r.tc.id)}"><td class="mono nowrap"><a href="${caseHref(r.s.id, r.tc.id)}">${esc(r.tc.id)}</a></td><td class="nowrap ink2">${esc(r.s.name)}</td><td><div class="clip">${esc(r.tc.input)}</div></td><td><div class="clip ink2">${esc(r.tc.expected)}</div></td><td><div class="clip ink2 mono">${esc(r.x ? r.x.actual : '')}</div></td><td>${r.x ? chip(r.x.verdict) : '<span class="muted">Not run</span>'}</td><td class="nowrap">${esc(r.x && r.x.category || '')}</td><td>${historyStrip(r.s.id, r.tc.id)}</td></tr>`).join('');
  return head('Test cases', 'Every test case across suites, with its latest actual output and result.') +
    `<div class="panel">${filters}<p class="note" style="margin:0 0 8px">${filtered.length} of ${rows.length} test cases</p><div class="tbl-wrap"><table class="tbl"><thead><tr><th>ID</th><th>Suite</th><th>Input</th><th>Expected behaviour</th><th>Latest actual output</th><th>Result</th><th>Failure reason</th><th>History</th></tr></thead><tbody>${body || '<tr><td colspan="8" class="muted">No test cases match these filters.</td></tr>'}</tbody></table></div></div>`;
}
function pageCase(suiteId, caseId) {
  const s = getSuite(suiteId); const tc = s && s.cases.find(c => c.id === caseId);
  if (!tc) return notFound('That test case no longer exists.');
  const rs = runsFor(s.id).filter(r => r.results.some(x => x.caseId === tc.id));
  const execs = rs.map(r => ({ r, x: r.results.find(y => y.caseId === tc.id) })).reverse();
  const passN = execs.filter(e => e.x.verdict === 'Pass').length;
  const checks = (tc.checks || []).map(c => { const ev = Evaluators[c.type]; return `<li><span class="ic ${ev && ev.manual ? 'part' : 'ok'}">${ev && ev.manual ? '?' : '✓'}</span><div><b>${esc(ev ? ev.label : c.type)}</b>: ${esc(ev ? ev.describe(c) : '')}${c.category ? ` <span class="muted">(fails as ${esc(c.category)})</span>` : ''}</div></li>`; }).join('');
  const lat = rs.length > 1 ? lineChart([{ name: 'Latency', color: 'var(--s2)', points: rs.map(r => { const x = r.results.find(y => y.caseId === tc.id); return { x: r.startedAt, y: x.latencyMs, href: traceHref(r.id, tc.id), title: `${r.version}: ${fmtMs(x.latencyMs)}` }; }) }], { h: 150, yMin: 0, yMax: Math.max(s.slaMs * 1.1, ...execs.map(e => e.x.latencyMs * 1.15)), yFmt: v => fmtMs(v), threshold: s.slaMs, thresholdLabel: 'SLA' }) : '<p class="muted">Needs two or more runs.</p>';
  return head(`<span class="mono" style="font-size:22px">${esc(tc.id)}</span>`, esc(tc.input), `<button class="btn danger" data-action="delete-case" data-suite="${esc(s.id)}" data-id="${esc(tc.id)}">Delete</button><button class="btn" data-action="edit-case" data-suite="${esc(s.id)}" data-id="${esc(tc.id)}">Edit</button>`, crumbs([['Overview', '#/dashboard'], [s.name, '#/suites/' + s.id], [tc.id]])) +
    `<div class="grid2" style="margin-top:0"><div class="panel"><h2>Definition</h2><p class="hint">${tc.tag ? esc(tc.tag) + ' · ' : ''}${esc(s.name)}${tc.origin ? ` · created from <a href="${traceHref(tc.origin.slice(0, tc.origin.indexOf('/')), tc.origin.slice(tc.origin.indexOf('/') + 1))}">a production request</a>` : ''}</p>
      <div class="io" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><div class="box"><h3>Input</h3><pre>${esc(tc.input)}</pre></div><div class="box"><h3>Expected behaviour</h3><pre>${esc(tc.expected)}</pre></div></div>
      <h3 style="font-size:13px;margin:16px 0 8px">Checks</h3><ul class="checks">${checks || '<li class="muted">No automated checks. Results go to review.</li>'}</ul></div>
      <div class="panel"><h2>Across runs</h2><p class="hint">Passed ${passN} of ${execs.length} runs.</p><div style="margin-bottom:12px">${historyStrip(s.id, tc.id, 20)}</div>${lat}</div></div>
    <div class="panel" style="margin-top:18px"><h2>Executions</h2><p class="hint">Newest first. Open one to see its full trace.</p><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Run</th><th>Version</th><th>Model</th><th>Timestamp</th><th>Result</th><th>Failure reason</th><th class="num">Latency</th><th>Actual output</th></tr></thead><tbody>
    ${execs.map(e => `<tr data-href="${traceHref(e.r.id, tc.id)}"><td class="mono nowrap"><a href="${traceHref(e.r.id, tc.id)}">${esc(e.r.id)}</a></td><td>${esc(e.r.version)}</td><td class="nowrap">${esc(e.r.model)}</td><td class="nowrap">${fmtDateTime(e.x.timestamp)}</td><td class="nowrap">${vchip(e.x)}</td><td class="nowrap">${esc(e.x.category || '')}</td><td class="num">${fmtMs(e.x.latencyMs)}</td><td><div class="clip mono ink2">${esc(e.x.actual)}</div></td></tr>`).join('') || '<tr><td colspan="8" class="muted">Not run yet.</td></tr>'}
    </tbody></table></div></div>`;
}

/* Results */
function pageResults(q) {
  const runs = evalRuns().filter(r => !q.suite || r.suiteId === q.suite).sort((a, b) => b.startedAt - a.startedAt);
  const body = runs.map(r => { const s = getSuite(r.suiteId); const su = runSummary(r); const pr = prevRun(r); return `<tr data-href="#/results/${esc(r.id)}"><td><input type="checkbox" data-compare="${esc(r.id)}" data-suite="${esc(r.suiteId)}" aria-label="Select ${esc(r.id)} to compare"></td><td class="mono nowrap"><a href="#/results/${esc(r.id)}">${esc(r.id)}</a></td><td class="nowrap">${esc(s ? s.name : r.suiteId)}</td><td>${esc(r.version)}</td><td class="nowrap">${esc(r.model)}</td><td class="nowrap">${fmtDate(r.startedAt)}</td><td class="num"><b>${fmtPct(su.passRate)}</b></td><td class="num">${pr ? deltaPts(su.passRate - runSummary(pr).passRate) : '–'}</td><td style="min-width:150px">${pfrBar(su)}</td><td class="num">${fmtMs(su.p50)}</td><td class="num">${fmtMs(su.p95)}</td></tr>`; }).join('');
  return head('Results', 'Every evaluation run. Select two runs of the same suite to compare them.', `<button class="btn primary" data-action="compare-selected" disabled>Compare selected</button>`) +
    `<div class="panel"><div class="filters"><label class="field" style="width:240px"><span>Suite</span><select data-filter-simple="suite" data-base="#/results"><option value="">All suites</option>${Store.state.suites.map(s => `<option value="${esc(s.id)}" ${q.suite === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th><span class="sr" style="position:absolute;left:-9999px">Select</span></th><th>Run</th><th>Suite</th><th>Version</th><th>Model</th><th>Date</th><th class="num">Pass rate</th><th class="num">Change</th><th>Pass / fail / review</th><th class="num">p50</th><th class="num">p95</th></tr></thead><tbody>${body || '<tr><td colspan="11" class="muted">No runs yet.</td></tr>'}</tbody></table></div></div>`;
}
function pageRunDetail(id, q) {

  const buckets = [500, 1000, 1500, 2000, 3000, 4000, Infinity]; const bl = ['<0.5s', '0.5–1s', '1–1.5s', '1.5–2s', '2–3s', '3–4s', '4s+'];

  const vf = `<div class="tabs">${['', 'Fail', 'Review', 'Pass'].map(v => `<a class="${(q.v || '') === v ? 'on' : ''}" href="#/results/${esc(r.id)}${qs({ v })}">${v || 'All'} (${v ? su[v] : su.n})</a>`).join('')}</div>`;
  return head(`${esc(s ? s.name : '')} ${esc(r.version)}`, `${esc(r.model)} · ${fmtDateTime(r.startedAt)} · ${Targets[r.target] ? Targets[r.target].label : r.target}${r.note ? '<br>' + esc(r.note) : ''}`,
    `${pr ? `<a class="btn" href="#/compare${qs({ suite: r.suiteId, a: pr.id, b: r.id })}">Compare with ${esc(pr.version)}</a>` : ''}<button class="btn danger" data-action="delete-run" data-id="${esc(r.id)}">Delete run</button>`,
    crumbs([['Results', '#/results'], [s ? s.name : r.suiteId, s ? '#/suites/' + s.id : null], [r.id]])) +
    `<section class="kpis" style="margin-top:0"><div class="kpi"><div class="l">Pass rate</div><div class="v">${fmtPct(su.passRate)}</div><div class="d">${ps ? deltaPts(su.passRate - ps.passRate) + ' vs ' + esc(pr.version) : '<span class="flat">first run</span>'}</div></div>
      <div class="kpi"><div class="l">Pass / fail / review</div>${pfrBar(su)}</div>
      <div class="kpi"><div class="l">Regressions</div><div class="v ${cmp && cmp.regressions.length ? 'down' : ''}">${cmp ? cmp.regressions.length : '–'}</div><div class="d muted">${cmp ? `${cmp.fixes.length} fixed since ${esc(pr.version)}` : 'no earlier run'}</div></div>
      <div class="kpi"><div class="l">p50 / p95 latency</div><div class="v">${fmtMs(su.p50)} <span class="muted" style="font-weight:500">/ ${fmtMs(su.p95)}</span></div><div class="d">p95 ${ps ? deltaMs(su.p95 - ps.p95) : '<span class="flat">first run</span>'}</div></div>

    </tbody></table></div></div>`;
}

/* Compare */
function pageCompare(q) {
  const S = Store.state;
  const suite = getSuite(q.suite) || (getRun(q.b) && getSuite(getRun(q.b).suiteId)) || S.suites.find(s => runsFor(s.id).length > 1) || S.suites[0];
  if (!suite) return head('Compare runs') + '<div class="panel empty"><h3>Nothing to compare yet</h3></div>';
  const rs = runsFor(suite.id);
  if (rs.length < 2) return head('Compare runs', 'Pick a baseline and a candidate run of the same suite.') + suitePicker(suite) + `<div class="panel empty"><h3>This suite has one run or fewer</h3><p>Run it again to compare versions.</p><a class="btn primary" href="#/run${qs({ suite: suite.id })}">Run evaluation</a></div>`;
  let b = rs.find(r => r.id === q.b) || rs[rs.length - 1];
  let a = rs.find(r => r.id === q.a) || rs[Math.max(0, rs.indexOf(b) - 1)];
  if (a.id === b.id) a = rs[Math.max(0, rs.indexOf(b) - 1)] === b ? rs[1] : rs[Math.max(0, rs.indexOf(b) - 1)];
  const sa = runSummary(a), sb = runSummary(b); const c = compareRuns(a, b);
  const opt = (sel) => rs.map(r => `<option value="${esc(r.id)}" ${r.id === sel.id ? 'selected' : ''}>${esc(r.version)} · ${esc(r.model)} · ${fmtDate(r.startedAt)} (${esc(r.id)})</option>`).join('');
  const picker = `<div class="panel"><div class="filters" style="margin:0">
    <label class="field" style="width:240px"><span>Suite</span><select data-cmp="suite">${S.suites.map(s => `<option value="${esc(s.id)}" ${s.id === suite.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>
    <label class="field" style="flex:1;min-width:220px"><span>Baseline</span><select data-cmp="a">${opt(a)}</select></label>
    <label class="field" style="flex:1;min-width:220px"><span>Candidate</span><select data-cmp="b">${opt(b)}</select></label>
    <button class="btn sm" data-action="swap-compare" style="margin-bottom:4px">Swap</button></div></div>`;
  const catKeys = [...new Set([...Object.keys(sa.cats), ...Object.keys(sb.cats)])].sort((x, y) => (sb.cats[y] || 0) - (sb.cats[x] || 0));
  const verdictLine = c.regressions.length ? `<b class="down">${esc(b.version)} regressed on ${c.regressions.length} test case${c.regressions.length > 1 ? 's' : ''}</b>${c.fixes.length ? ` and fixed ${c.fixes.length}` : ''}.` : c.fixes.length ? `<b class="up">${esc(b.version)} fixed ${c.fixes.length} test case${c.fixes.length > 1 ? 's' : ''} with no regressions.</b>` : `<b>No test case changed from pass to fail or back.</b>`;
