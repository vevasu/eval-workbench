<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writer and Critic</title>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --ink:#1b2333; --muted:#5b667a; --line:#d9dfea; --brand:#1f3a68; --ok:#1d7a4f; --warn:#a86a00; --err:#b3261e;
          --planner:#5b4bb7; --writer:#1f6fb2; --critic:#b3541e; --editor:#1d7a4f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1420; --card:#182033; --ink:#e8ecf5; --muted:#9aa6bd; --line:#2a344c; --brand:#7aa2f7; --ok:#59c48f; --warn:#e3ad45; --err:#f28b82;
          --planner:#a99bff; --writer:#78b7f0; --critic:#f0a070; --editor:#59c48f; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
  header { padding:20px 24px 4px; } h1 { margin:0; font-size:22px; } header p { margin:4px 0 0; color:var(--muted); font-size:14px; }
  .layout { display:grid; grid-template-columns:minmax(280px,360px) 1fr; gap:20px; padding:16px 24px 32px; align-items:start; }
  @media (max-width:800px) { .layout { grid-template-columns:1fr; padding:12px 16px 24px; } }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  label { display:block; font-weight:600; font-size:13px; margin:0 0 4px; }
  input, select, textarea, button { font:inherit; }
  input, select, textarea { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); margin-bottom:12px; }
  textarea { min-height:70px; resize:vertical; }
  button.primary { width:100%; padding:11px; border:0; border-radius:8px; background:var(--brand); color:#fff; font-weight:600; cursor:pointer; }
  @media (prefers-color-scheme: dark) { button.primary { color:#0f1420; } }
  button:disabled { opacity:.6; cursor:wait; }
  button.small { padding:5px 10px; border:1px solid var(--line); border-radius:6px; background:none; color:var(--ink); cursor:pointer; font-size:13px; }
  :focus-visible { outline:3px solid var(--brand); outline-offset:2px; }
  .meta { color:var(--muted); font-size:12.5px; margin-top:10px; }
  .step { border-left:4px solid var(--line); margin:0 0 12px; padding:2px 0 2px 12px; }
  .step.planner { border-color:var(--planner); } .step.writer { border-color:var(--writer); } .step.critic { border-color:var(--critic); } .step.editor { border-color:var(--editor); }
  .step h3 { margin:0; font-size:15px; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .agent { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .planner .agent { color:var(--planner); } .writer .agent { color:var(--writer); } .critic .agent { color:var(--critic); } .editor .agent { color:var(--editor); }
  .cost { color:var(--muted); font-size:12px; font-weight:400; }
  details { margin-top:6px; } summary { cursor:pointer; color:var(--muted); font-size:13px; }
  pre { white-space:pre-wrap; word-break:break-word; font:14px/1.55 system-ui, sans-serif; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px; margin:8px 0 0; max-height:340px; overflow:auto; }
  .scores { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:6px 14px; margin:8px 0; font-size:13px; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:2px; } .bar i { display:block; height:100%; background:var(--critic); }
  .verdict { font-weight:700; } .verdict.ok { color:var(--ok); } .verdict.no { color:var(--warn); }
  ul.issues { margin:4px 0 0; padding-left:18px; font-size:14px; }
  .working { color:var(--muted); font-size:14px; padding:6px 0 6px 16px; } .working::before { content:""; display:inline-block; width:8px; height:8px; margin-right:8px; border-radius:50%; background:var(--brand); animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.25; } } @media (prefers-reduced-motion:reduce) { .working::before { animation:none; } }
  .final { border:2px solid var(--editor); } .final h2 { margin:0 0 4px; font-size:17px; } .final pre { max-height:none; font-size:15px; }
  .stats { display:flex; gap:16px; flex-wrap:wrap; color:var(--muted); font-size:13px; margin:6px 0 8px; } .stats b { color:var(--ink); }
  .err { color:var(--err); } .empty { color:var(--muted); text-align:center; padding:40px 12px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header><h1>Writer and Critic</h1><p>Four agents work as a team: a planner, a writer, a critic who sends drafts back, and an editor.</p></header>
<div class="layout">
  <form class="panel" id="f">
    <label for="topic">Topic</label><input id="topic" required maxlength="300" value="Why small code reviews beat big ones">
    <label for="audience">Target audience</label><input id="audience" maxlength="200" value="engineering managers">
    <label for="points">Key points (one per line)</label><textarea id="points">Big reviews get rubber-stamped
Small ones ship faster
Reviewers stay focused</textarea>
    <label for="format">Format</label>
    <select id="format"><option>LinkedIn post</option><option>blog post</option><option>email summary</option></select>
    <label for="criteria">Editing criteria</label><textarea id="criteria"></textarea>
    <button class="primary" id="go">Start the team</button>
    <div class="meta" id="cfg"></div>
  </form>
  <main id="out" aria-live="polite"><div class="panel empty">Fill in the brief and start the team. Each agent's work appears here as it finishes.</div></main>
</div>
<script>
const $ = id => document.getElementById(id);
const NAMES = { planner: 'Planner', writer: 'Writer', critic: 'Critic', editor: 'Editor' };
let timer = null;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function stepCard(s) {
  const d = el('div', 'step ' + s.agent);
  const h = el('h3'); h.append(el('span', 'agent', NAMES[s.agent]), s.label, el('span', 'cost', `${s.seconds}s · ${s.inputTokens + s.outputTokens} tokens`));
  d.append(h);
  if (s.review) {
    const r = s.review, approved = r.verdict === 'approve';
    const line = el('div'); line.append('Average ', el('b', '', r.average + ' / 5'), ' · ', el('span', 'verdict ' + (approved ? 'ok' : 'no'), approved ? 'Approved' : 'Needs revision'));
    d.append(line);
    const sc = el('div', 'scores');
    Object.entries(r.scores).forEach(([k, v]) => { const c = el('div'); c.append(k.replace('_', ' ') + ': ' + v); const b = el('div', 'bar'); const i = el('i'); i.style.width = (v / 5 * 100) + '%'; b.append(i); c.append(b); sc.append(c); });
    d.append(sc);
    if (r.issues.length) { const ul = el('ul', 'issues'); r.issues.forEach(t => ul.append(el('li', '', t))); d.append(ul); }
    if (r.instructions) d.append(el('div', 'meta', 'Instructions to the writer: ' + r.instructions));
  } else {
    const det = el('details'); det.append(el('summary', '', 'Show output'), el('pre', '', s.text)); d.append(det);
  }
  return d;
}

function render(job) {
  const out = $('out'); out.replaceChildren();
  const p = el('div', 'panel'); out.append(p);
  job.steps.forEach(s => p.append(stepCard(s)));
  if (job.current) p.append(el('div', 'working', job.current.label + '...'));
  if (job.status === 'error') p.append(el('p', 'err', job.error));
  if (job.result) {
    const r = job.result, f = el('div', 'panel final'); f.style.marginTop = '16px';
    f.append(el('h2', '', 'Final version'));
    const st = el('div', 'stats');
    [['Words', `${r.wordsBefore} → ${r.wordsAfter} (${Math.round((r.wordsAfter - r.wordsBefore) / r.wordsBefore * 100)}%)`], ['Critique rounds', r.rounds + (r.approvedEarly ? ' (approved)' : ' (limit reached)')], ['Time', r.seconds + 's'], ['Tokens', r.inputTokens + r.outputTokens]]
      .forEach(([k, v]) => { const s = el('span'); s.append(k + ' ', el('b', '', v)); st.append(s); });
    f.append(st, el('pre', '', r.final));
    const copy = el('button', 'small', 'Copy final version'); copy.type = 'button'; copy.style.marginTop = '10px';
    copy.onclick = async () => { try { await navigator.clipboard.writeText(r.final); copy.textContent = 'Copied'; } catch (e) { copy.textContent = 'Copy failed'; } };
    const det = el('details'); det.append(el('summary', '', 'Compare with the first draft'), el('pre', '', r.firstDraft));
    f.append(copy, det); out.append(f);
  }
}

async function poll(id) {
  try {
    const job = await (await fetch('/api/jobs/' + id)).json();
    render(job);
    if (job.status === 'running') { timer = setTimeout(() => poll(id), 1000); return; }
  } catch (e) { $('out').replaceChildren(el('div', 'panel err', 'Lost contact with the server.')); }
  $('go').disabled = false; $('go').textContent = 'Start the team';
}

$('f').addEventListener('submit', async e => {
  e.preventDefault(); clearTimeout(timer);
  $('go').disabled = true; $('go').textContent = 'Team is working...';
  $('out').replaceChildren(el('div', 'panel empty', 'Starting...'));
  const res = await fetch('/api/jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
    topic: $('topic').value, audience: $('audience').value, keyPoints: $('points').value, format: $('format').value, criteria: $('criteria').value }) });
  if (!res.ok) { $('out').replaceChildren(el('div', 'panel err', 'Could not start: ' + (await res.text()))); $('go').disabled = false; $('go').textContent = 'Start the team'; return; }
  poll((await res.json()).id);
});

fetch('/api/config').then(r => r.json()).then(c => {
  $('criteria').value = c.defaultCriteria;
  $('cfg').textContent = `${c.provider} ${c.model} · up to ${c.maxRounds} revision rounds · approve at ${c.approveScore}/5 · Workbench tracing ${c.tracing ? 'on' : 'off'}`;
});
</script>
</body>
</html>
